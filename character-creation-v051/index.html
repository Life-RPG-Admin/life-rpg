
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE RPG | Hero's Appearance 0.5.1</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;
 background:radial-gradient(ellipse at top,#35445d,#141d2b 55%,#090e16);
 color:#f4e5c5;
 font-family:Georgia,serif;
}
main{max-width:480px;margin:auto;padding:20px 16px 40px}
h1{text-align:center;font-size:30px;margin:12px 0}
.sub{text-align:center;color:#d2c4a8;font-size:14px;line-height:1.5}
.chapter{text-align:center;color:#e2be79;font-size:11px;letter-spacing:3px}
.frame{
 margin:22px auto;
 height:340px;
 max-width:330px;
 border:3px solid #bc9656;
 border-radius:155px 155px 18px 18px;
 background:radial-gradient(circle,#64718a,#26354c 65%,#111a29);
 box-shadow:0 12px 35px #0009,inset 0 0 0 5px #182233;
 overflow:hidden;
 position:relative;
}
.frame:before{
 content:"✦";
 position:absolute;
 top:10px;left:50%;
 transform:translateX(-50%);
 font-size:28px;color:#efcc83;
}
svg{width:100%;height:100%;filter:drop-shadow(0 5px 8px #0008)}
.panel{
 background:#192535;
 border:1px solid #8e7248;
 border-radius:13px;
 padding:18px;
 margin-top:15px;
}
h2{font-size:19px;color:#e7c580;margin:0 0 15px}
label{display:block;margin:17px 0 9px;font-size:14px}
input{
 width:100%;
 background:#101925;
 border:1px solid #a58a59;
 border-radius:8px;
 color:#fff;
 padding:13px;
 font-size:16px;
}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-family:inherit;cursor:pointer}
.option{
 padding:12px 5px;
 background:#26364a;
 border:1px solid #796d5b;
 color:#e8dcc4;
 border-radius:8px;
 font-size:13px;
}
.option.active{
 background:#59482c;
 border:2px solid #edca7b;
 color:#fff0c6;
}
.swatches{display:flex;flex-wrap:wrap;gap:13px;padding:5px}
.swatch{
 width:37px;height:37px;
 border-radius:50%;
 border:2px solid #8e929c;
}
.swatch.active{outline:2px solid #f3cf80;outline-offset:3px}
.save{
 width:100%;
 padding:16px;
 margin-top:22px;
 background:linear-gradient(#f5d99b,#b78b43);
 border:1px solid #f8e4ae;
 border-radius:9px;
 color:#18212c;
 font-size:16px;
 font-weight:bold;
}
.note{text-align:center;color:#b9b7b1;font-size:12px;line-height:1.5}
#status{text-align:center;color:#e8c77e;min-height:20px}
</style>
</head>
<body>
<main>
<div class="chapter">LIFE RPG · THE AWAKENING</div>
<h1>The Hero's Appearance</h1>
<p class="sub">Every legend begins with a hero.<br>Shape the adventurer who will walk your path.</p>

<div class="frame">
<svg viewBox="0 0 330 340" role="img" aria-label="Customizable illustrated fantasy hero">
<defs>
<radialGradient id="glow">
<stop stop-color="#e6c17a" stop-opacity=".55"/>
<stop offset="1" stop-color="#e6c17a" stop-opacity="0"/>
</radialGradient>
<linearGradient id="cloth" x2="1" y2="1">
<stop stop-color="#657b94"/>
<stop offset="1" stop-color="#26354d"/>
</linearGradient>
</defs>
<circle cx="165" cy="170" r="145" fill="url(#glow)"/>

<!-- Cloak and shoulders -->
<path id="body" d="M58 340 Q60 237 115 211 L215 211 Q270 237 272 340Z"
 fill="url(#cloth)" stroke="#d3ae6e" stroke-width="3"/>
<path id="outfit" d="M104 340 L118 229 151 212 179 212 212 229 226 340Z"
 fill="#45556c" stroke="#c6a56b" stroke-width="3"/>

<!-- Neck -->
<path d="M146 213V181H184V213Q165 236 146 213Z"
 fill="var(--skin,#d4a27f)"/>

<!-- Face -->
<ellipse id="face" cx="165" cy="144" rx="53" ry="69"
 fill="var(--skin,#d4a27f)" stroke="#765343" stroke-width="2"/>

<!-- Hair -->
<g id="hair">
<path id="hairTop" d="M112 146 Q99 59 163 57 Q232 54 218 146 L206 114 Q187 93 164 92 Q143 105 120 116Z"
 fill="var(--hair,#322720)"/>
<path id="hairSides" d="M112 141Q105 105 119 89L125 171Z M218 141Q225 105 211 89L205 171Z"
 fill="var(--hair,#322720)"/>
</g>

<!-- Eyes -->
<path d="M132 143q12-8 23 0 M175 143q12-8 23 0"
 stroke="#332a28" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="144" cy="144" r="2" fill="#1b2633"/>
<circle cx="186" cy="144" r="2" fill="#1b2633"/>

<!-- Nose and mouth -->
<path d="M165 147l-4 19 8 1 M152 183q13 7 26 0"
 stroke="#875a4b" stroke-width="2" fill="none" stroke-linecap="round"/>

<!-- Optional facial details -->
<g id="details"></g>

<!-- Armour trim -->
<path d="M118 224L165 271 212 224"
 fill="none" stroke="#efd19a" stroke-width="4"/>
<circle cx="165" cy="279" r="13"
 fill="#cba35c" stroke="#fff0b7" stroke-width="2"/>
<path d="M165 268l7 11-7 11-7-11Z" fill="#314b68"/>
</svg>
</div>

<div class="panel">
<h2>Chapter I — Identity</h2>
<label for="heroName">Adventurer's Name</label>
<input id="heroName" maxlength="24" placeholder="Enter your legendary name">

<label>Character Presentation</label>
<div class="options" id="gender">
<button class="option active" data-value="masculine">Masculine</button>
<button class="option" data-value="feminine">Feminine</button>
<button class="option" data-value="custom">Custom</button>
</div>

<label>Hairstyle</label>
<div class="options" id="hairstyle">
<button class="option active" data-value="short">Short</button>
<button class="option" data-value="long">Long</button>
<button class="option" data-value="swept">Swept</button>
</div>

<label>Hair Colour</label>
<div class="swatches" id="haircolor">
<button class="swatch active" style="background:#322720" data-value="#322720" aria-label="Dark brown"></button>
<button class="swatch" style="background:#a06c3d" data-value="#a06c3d" aria-label="Chestnut"></button>
<button class="swatch" style="background:#e0c17b" data-value="#e0c17b" aria-label="Blonde"></button>
<button class="swatch" style="background:#c5c5cf" data-value="#c5c5cf" aria-label="Silver"></button>
</div>

<label>Skin Tone</label>
<div class="swatches" id="skin">
<button class="swatch active" style="background:#d4a27f" data-value="#d4a27f" aria-label="Warm"></button>
<button class="swatch" style="background:#8d5942" data-value="#8d5942" aria-label="Deep"></button>
<button class="swatch" style="background:#edc6a6" data-value="#edc6a6" aria-label="Light"></button>
<button class="swatch" style="background:#b47b55" data-value="#b47b55" aria-label="Medium"></button>
</div>

<label>Facial Details</label>
<div class="options" id="facial">
<button class="option active" data-value="none">None</button>
<button class="option" data-value="scar">Scar</button>
<button class="option" data-value="freckles">Freckles</button>
</div>

<label>Starting Outfit</label>
<div class="options" id="clothing">
<button class="option active" data-value="guardian">Guardian</button>
<button class="option" data-value="traveler">Traveler</button>
<button class="option" data-value="mystic">Mystic</button>
</div>

<button class="save" id="save">Seal My Appearance ✦</button>
<p id="status" role="status"></p>
<p class="note">Your appearance is purely cosmetic. No attributes, XP, classes or mastery are affected.</p>
</div>
</main>

<script>
const KEY="lifeRpgHeroAppearanceV051";
let hero={
 name:"",
 gender:"masculine",
 hairstyle:"short",
 haircolor:"#322720",
 skin:"#d4a27f",
 facial:"none",
 clothing:"guardian"
};

try{
 const stored=JSON.parse(localStorage.getItem(KEY));
 if(stored&&typeof stored==="object"){
  for(const k of Object.keys(hero)){
   if(typeof stored[k]==="string")hero[k]=stored[k];
  }
 }
}catch(e){}

const $=id=>document.getElementById(id);

function choose(group,value){
 hero[group]=value;
 render();
}

["gender","hairstyle","haircolor","skin","facial","clothing"].forEach(group=>{
 $(group).addEventListener("click",e=>{
  const b=e.target.closest("[data-value]");
  if(b)choose(group,b.dataset.value);
 });
});

function render(){
 for(const group of ["gender","hairstyle","haircolor","skin","facial","clothing"]){
  $(group).querySelectorAll("[data-value]").forEach(b=>{
   const active=b.dataset.value===hero[group];
   b.classList.toggle("active",active);
   b.setAttribute("aria-pressed",String(active));
  });
 }

 document.querySelector("svg").style.setProperty("--skin",hero.skin);
 document.querySelector("svg").style.setProperty("--hair",hero.haircolor);

 const face=$("face");
 const body=$("body");

 if(hero.gender==="masculine"){
  face.setAttribute("rx","53");
  body.setAttribute("d","M50 340Q54 233 110 211L220 211Q276 233 280 340Z");
 }else if(hero.gender==="feminine"){
  face.setAttribute("rx","48");
  body.setAttribute("d","M72 340Q78 239 125 211L205 211Q252 239 258 340Z");
 }else{
  face.setAttribute("rx","50");
  body.setAttribute("d","M61 340Q65 236 116 211L214 211Q265 236 269 340Z");
 }

 const top=$("hairTop");
 const sides=$("hairSides");

 if(hero.hairstyle==="short"){
  top.setAttribute("d","M112 146Q99 59 163 57Q232 54 218 146L206 114Q187 93 164 92Q143 105 120 116Z");
  sides.setAttribute("d","M112 141Q105 105 119 89L125 171Z M218 141Q225 105 211 89L205 171Z");
 }else if(hero.hairstyle==="long"){
  top.setAttribute("d","M110 146Q96 48 163 50Q237 46 220 146L206 114Q187 90 164 92Q140 105 120 116Z");
  sides.setAttribute("d","M112 112Q92 190 102 259L130 244L124 124Z M218 112Q238 190 228 259L200 244L206 124Z");
 }else{
  top.setAttribute("d","M112 146Q101 91 118 74Q155 38 220 69L229 99Q188 78 139 103L120 121Z");
  sides.setAttribute("d","M112 141L125 169L120 111Z M218 141L205 169L210 111Z");
 }

 const details=$("details");
 details.replaceChildren();

 const ns="http://www.w3.org/2000/svg";
 if(hero.facial==="scar"){
  const p=document.createElementNS(ns,"path");
  p.setAttribute("d","M194 154l-12 22");
  p.setAttribute("stroke","#945d51");
  p.setAttribute("stroke-width","3");
  details.appendChild(p);
 }
 if(hero.facial==="freckles"){
  [[137,158],[145,161],[151,157],[180,157],[187,161],[194,158]].forEach(([x,y])=>{
   const c=document.createElementNS(ns,"circle");
   c.setAttribute("cx",x);
   c.setAttribute("cy",y);
   c.setAttribute("r","2");
   c.setAttribute("fill","#9c6850");
   details.appendChild(c);
  });
 }

 const colors={
  guardian:"#45556c",
  traveler:"#6b563f",
  mystic:"#51456f"
 };
 $("outfit").setAttribute("fill",colors[hero.clothing]);
}

$("heroName").value=hero.name;
render();

$("save").addEventListener("click",()=>{
 hero.name=$("heroName").value.trim().replace(/\s+/g," ");
 if(hero.name.length<2){
  $("status").textContent="Please enter a name with at least 2 characters.";
  return;
 }
 try{
  localStorage.setItem(KEY,JSON.stringify(hero));
  $("status").textContent="✦ Appearance saved, "+hero.name+"! Your legend awaits.";
 }catch(e){
  $("status").textContent="Appearance selected, but browser storage is unavailable.";
 }
});
</script>
</body>
  </html>

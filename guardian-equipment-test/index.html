<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Test 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#172334;color:#f4e4c2;font:14px system-ui,sans-serif}
#scene{position:fixed;inset:0}
#panel{
 position:fixed;top:12px;left:12px;right:12px;
 padding:12px 15px;border:1px solid #9b7b43;
 border-radius:12px;background:rgba(13,20,30,.92);
 pointer-events:none;
}
h1{margin:0 0 5px;font-size:17px;color:#e9c77c}
#status{font-size:12px;line-height:1.4}
#controls{
 position:fixed;bottom:14px;left:12px;right:12px;
 padding:12px;text-align:center;
 background:rgba(13,20,30,.9);border-radius:10px;
}
button{
 padding:10px 18px;margin-bottom:8px;
 border:1px solid #dfbd7d;border-radius:8px;
 background:#916b35;color:white;font-weight:700;
}
#info{font-size:12px}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>
<body>

<div id="scene"></div>

<div id="panel">
 <h1>LIFE RPG — Guardian</h1>
 <div id="status">Starting 3D engine...</div>
</div>

<div id="controls">
 <button id="reset">Reset Camera</button>
 <div id="info">
  Drag to rotate · Pinch to zoom
  <div>Build 0.5.4 — Test 3D</div>
 </div>
</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const status=document.getElementById("status");
const container=document.getElementById("scene");
const panel=document.getElementById("panel");
const footer=document.getElementById("controls");

function setStatus(message){
 status.textContent=message;
}

window.addEventListener("error",e=>{
 setStatus("ERROR: "+e.message);
});
window.addEventListener("unhandledrejection",e=>{
 setStatus("ERROR: "+String(e.reason));
});

try{
 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x172334);

 const camera=new THREE.PerspectiveCamera(
  40,innerWidth/innerHeight,0.01,1000
 );

 const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 container.appendChild(renderer.domElement);

 const controls=new OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true;
 controls.enablePan=false;
 controls.minPolarAngle=0.2;
 controls.maxPolarAngle=Math.PI-0.2;

 scene.add(new THREE.HemisphereLight(
  0xffffff,0x566070,2.2
 ));

 const light=new THREE.DirectionalLight(0xffe6bd,3);
 light.position.set(3,6,5);
 scene.add(light);

 const ground=new THREE.Mesh(
  new THREE.CircleGeometry(2.5,64),
  new THREE.MeshStandardMaterial({
   color:0x344139,roughness:1
  })
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-0.02;
 scene.add(ground);

 let guardian=null;

 function fitCamera(){
  if(!guardian)return;

  const bounds=new THREE.Box3().setFromObject(guardian);
  const size=bounds.getSize(new THREE.Vector3());
  const center=bounds.getCenter(new THREE.Vector3());

  // Reserve space for interface panels.
  const top=panel.getBoundingClientRect().bottom+20;
  const bottom=footer.getBoundingClientRect().top-20;
  const available=Math.max(100,bottom-top);

  const vFov=THREE.MathUtils.degToRad(camera.fov);
  const hFov=2*Math.atan(
   Math.tan(vFov/2)*camera.aspect
  );

  // Required camera distance for full-body framing.
  const verticalDistance=
   (size.y*1.18)/
   (2*Math.tan(vFov/2)*(available/innerHeight));

  const horizontalDistance=
   (size.x*1.18)/(2*Math.tan(hFov/2));

  const distance=Math.max(
   verticalDistance,
   horizontalDistance,
   size.z*2,
   4
  );

  // Centre Guardian inside the visible area.
  const visibleMid=(top+bottom)/2;
  const offsetPixels=visibleMid-innerHeight/2;
  const offsetWorld=
   offsetPixels*2*distance*Math.tan(vFov/2)/innerHeight;

  // The camera is level with its target.
  // Offset the camera and target together.
  const targetY=center.y-offsetWorld;

  controls.target.set(center.x,targetY,center.z);
  camera.position.set(
   center.x,
   targetY,
   center.z+distance
  );

  controls.minDistance=Math.max(size.y*.7,1);
  controls.maxDistance=Math.max(distance*5,30);

  camera.near=0.01;
  camera.far=Math.max(distance*30,100);
  camera.updateProjectionMatrix();
  controls.update();
 }

 document.getElementById("reset").onclick=fitCamera;

 setStatus("Loading Guardian model...");

 const loader=new GLTFLoader();

 loader.load(
  "../guardian-3d-test/Superhero_Male_FullBody.gltf",
  gltf=>{
   guardian=gltf.scene;

   const bounds=new THREE.Box3().setFromObject(guardian);
   const size=bounds.getSize(new THREE.Vector3());
   const center=bounds.getCenter(new THREE.Vector3());

   if(size.y<=0){
    setStatus("ERROR: Invalid model dimensions");
    return;
   }

   guardian.scale.multiplyScalar(2.5/size.y);

   bounds.setFromObject(guardian);
   bounds.getCenter(center);

   guardian.position.x-=center.x;
   guardian.position.z-=center.z;
   guardian.position.y-=bounds.min.y;

   scene.add(guardian);
   fitCamera();

   setStatus("SUCCESS — Guardian loaded!");
  },
  undefined,
  error=>{
   console.error(error);
   setStatus("MODEL ERROR: "+(
    error.message||String(error)
   ));
  }
 );

 addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  fitCamera();
 });

 renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene,camera);
 });

}catch(error){
 setStatus("ENGINE ERROR: "+error.message);
}
</script>
</body>
</html>

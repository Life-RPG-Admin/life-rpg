
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian 3I.9</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101722;color:#f3e4c5;font:13px system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#top{position:fixed;top:8px;left:8px;right:8px;background:#111b2be8;border:1px solid #a88b55;border-radius:10px;padding:9px;pointer-events:none}
h3{margin:0 0 4px;color:#e8c47a;font-size:15px}
#status,#debug{font-size:11px;line-height:1.5}
#debug{color:#b8c9d5}
#panel{position:fixed;bottom:8px;left:8px;right:8px;max-height:36vh;overflow:auto;background:#101a2be8;border:1px solid #a88b55;border-radius:12px;padding:10px}
button{background:#29394d;color:white;border:1px solid #b99a59;border-radius:7px;padding:9px;margin:3px}
button.active{background:#765d30}
.setting{display:grid;grid-template-columns:100px 1fr 35px;gap:7px;align-items:center;margin:9px 0}
input[type=range]{width:100%;accent-color:#d6ad64}
small{color:#afbdca}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="scene"></div>
<div id="top">
<h3>LIFE RPG — Guardian 3I.9</h3>
<div id="status">Loading Guardian...</div>
<div id="debug">Anatomical arm reconstruction</div>
</div>
<div id="panel">
<div>
<button id="unarmed">Unarmed</button>
<button id="longsword" class="active">Longsword</button>
<button id="breath">Breathing ON</button>
<button id="markers">Markers ON</button>
<button id="reset">Reset Camera</button>
</div>
<div id="weaponControls">
<small>Weapon-specific calibration — development only</small>
<div id="sliders"></div>
</div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(
40,innerWidth/innerHeight,.05,100
);
camera.position.set(0,1.45,9);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.25,0);
controls.enableDamping=true;
controls.minDistance=2.5;
controls.maxDistance=30;
controls.update();

scene.add(new THREE.HemisphereLight(0xeaf2ff,0x394457,2.3));

const sun=new THREE.DirectionalLight(0xffe4bc,2.5);
sun.position.set(3,7,6);
scene.add(sun);

const floor=new THREE.Mesh(
new THREE.CircleGeometry(3.4,64),
new THREE.MeshStandardMaterial({color:0x273445})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.025;
scene.add(floor);

let guardian=null;
let sword=null;
let mode='sword';
let breathing=true;
let showMarkers=true;

const bones={};
const originals=new Map();

const settings={
angle:38,
forward:46,
height:38,
spacing:20,
elbowOut:32,
curl:70
};

const configs=[
['angle','Blade Angle',15,65],
['forward','Grip Forward',20,75],
['height','Grip Drop',20,65],
['spacing','Hand Spacing',12,30],
['elbowOut','Elbow Spread',10,65],
['curl','Finger Curl',0,100]
];

for(const [key,label,min,max] of configs){
const row=document.createElement('div');
row.className='setting';
const title=document.createElement('span');
title.textContent=label;

const input=document.createElement('input');
input.type='range';
input.min=min;
input.max=max;
input.value=settings[key];

const val=document.createElement('span');
val.textContent=input.value;

input.oninput=()=>{
settings[key]=+input.value;
val.textContent=input.value;
updatePose();
};

row.append(title,input,val);
document.getElementById('sliders').appendChild(row);
}

function bone(name){
return bones[name]||null;
}

function pos(b){
return b.getWorldPosition(V());
}

function updateWorld(){
guardian.updateMatrixWorld(true);
}

function capture(){
guardian.traverse(o=>{
if(o.isBone){
bones[o.name.toLowerCase()]=o;
originals.set(o,o.quaternion.clone());
}
});
}

function restore(){
for(const [b,q] of originals){
b.quaternion.copy(q);
}
updateWorld();
}

function natural(){
const l=bone('upperarm_l');
const r=bone('upperarm_r');

if(l)l.rotateZ(-1.35);
if(r)r.rotateZ(1.35);

for(const side of ['l','r']){
const f=bone('lowerarm_'+side);
const h=bone('hand_'+side);

if(f)f.rotateX(.46*.18);
if(h)h.rotateX(.19*.14);
}

for(const [name,b] of Object.entries(bones)){
if(/finger|thumb|index|middle|ring|pinky/.test(name)){
b.rotateX(.66*.35);
}
}

updateWorld();
}

function createSword(){
const g=new THREE.Group();

const steel=new THREE.MeshStandardMaterial({
color:0xcbd6df,metalness:.8,roughness:.27
});
const leather=new THREE.MeshStandardMaterial({
color:0x35251a,roughness:.85
});
const gold=new THREE.MeshStandardMaterial({
color:0xbfa16a,metalness:.7,roughness:.3
});

function cyl(rt,rb,h,y,m){
const x=new THREE.Mesh(
new THREE.CylinderGeometry(rt,rb,h,12),m
);
x.position.y=y;
g.add(x);
}

cyl(.024,.026,.54,-.19,leather);
cyl(.048,.048,.055,-.48,gold);

const guard=new THREE.Mesh(
new THREE.BoxGeometry(.40,.05,.08),gold
);
guard.position.y=.105;
g.add(guard);

const blade=new THREE.Mesh(
new THREE.BoxGeometry(.105,1.42,.035),steel
);
blade.position.y=.84;
g.add(blade);

const tip=new THREE.Mesh(
new THREE.ConeGeometry(.074,.23,4),steel
);
tip.position.y=1.66;
tip.rotation.y=Math.PI/4;
g.add(tip);

scene.add(g);
return g;
}

const markerGroup=new THREE.Group();
scene.add(markerGroup);

function mk(color,r=.032){
const m=new THREE.Mesh(
new THREE.SphereGeometry(r,12,8),
new THREE.MeshBasicMaterial({color,depthTest:false})
);
markerGroup.add(m);
return m;
}

const marks={
leftTarget:mk(0x00e5ff),
rightTarget:mk(0xff9b33),
leftElbow:mk(0x36ff72,.045),
rightElbow:mk(0xff3ec9,.045),
leftWrist:mk(0xffffff,.022),
rightWrist:mk(0xffffff,.022)
};

function pointSegment(joint,child,desiredPoint){
updateWorld();

const start=pos(joint);
const current=pos(child).sub(start);
const desired=desiredPoint.clone().sub(start);

if(current.lengthSq()<1e-10||desired.lengthSq()<1e-10)return;

const delta=new THREE.Quaternion().setFromUnitVectors(
current.normalize(),desired.normalize()
);

const parentQ=joint.parent.getWorldQuaternion(
new THREE.Quaternion()
);
const worldQ=joint.getWorldQuaternion(
new THREE.Quaternion()
);

joint.quaternion.copy(
parentQ.invert().multiply(delta.multiply(worldQ))
);
updateWorld();
}

function solveArm(side,wanted,spread){
const upper=bone('upperarm_'+side);
const lower=bone('lowerarm_'+side);
const hand=bone('hand_'+side);

if(!upper||!lower||!hand)return null;

updateWorld();

const shoulder=pos(upper);
const elbow=pos(lower);
const wrist=pos(hand);

const a=shoulder.distanceTo(elbow);
const b=elbow.distanceTo(wrist);

if(a<.01||b<.01)return null;

const raw=wanted.clone().sub(shoulder);
const minD=Math.abs(a-b)+.002;
const maxD=a+b-.012;
const d=THREE.MathUtils.clamp(raw.length(),minD,maxD);
const axis=raw.normalize();

const target=shoulder.clone().addScaledVector(axis,d);

const along=(a*a-b*b+d*d)/(2*d);
const radius=Math.sqrt(Math.max(0,a*a-along*along));

const sideSign=side==='l'?-1:1;

const pole=shoulder.clone().add(
V(sideSign*(.20+spread),-.22,.62)
);

const bend=pole.sub(shoulder).addScaledVector(
axis,-pole.clone().sub(shoulder).dot(axis)
);

if(bend.lengthSq()<1e-8){
bend.set(sideSign,0,.3);
bend.addScaledVector(axis,-bend.dot(axis));
}

bend.normalize();

const elbowTarget=shoulder.clone()
.addScaledVector(axis,along)
.addScaledVector(bend,radius);

pointSegment(upper,lower,elbowTarget);
pointSegment(lower,hand,target);
pointSegment(upper,lower,elbowTarget);
pointSegment(lower,hand,target);

return {
upper,lower,hand,target,elbowTarget,
error:pos(hand).distanceTo(wanted)
};
}

function weaponFingers(){
for(const [name,b] of Object.entries(bones)){
if(/finger|thumb|index|middle|ring|pinky/.test(name)){
b.rotateX(settings.curl/100*.42);
}
}
}

function swordPose(){
const ul=bone('upperarm_l');
const ur=bone('upperarm_r');

if(!ul||!ur)return;

updateWorld();

const L=pos(ul);
const R=pos(ur);
const center=L.clone().add(R).multiplyScalar(.5);

const grip=V(
center.x,
center.y-settings.height/100,
center.z+settings.forward/100
);

const angle=THREE.MathUtils.degToRad(settings.angle);
const axis=V(
Math.sin(angle),
Math.cos(angle),
.20
).normalize();

sword.position.copy(grip);
sword.quaternion.setFromUnitVectors(V(0,1,0),axis);
sword.updateMatrixWorld(true);

const gap=settings.spacing/100;

const upperGrip=grip.clone()
.addScaledVector(axis,-.12+gap/2);

const lowerGrip=grip.clone()
.addScaledVector(axis,-.12-gap/2);

const leftTarget=upperGrip.clone().add(V(-.045,0,.02));
const rightTarget=lowerGrip.clone().add(V(.045,0,.02));

marks.leftTarget.position.copy(leftTarget);
marks.rightTarget.position.copy(rightTarget);

const left=solveArm('l',leftTarget,settings.elbowOut/100);
const right=solveArm('r',rightTarget,settings.elbowOut/100);

if(!left||!right){
document.getElementById('debug').textContent='Arm chain missing';
return;
}

weaponFingers();
updateWorld();

marks.leftElbow.position.copy(pos(left.lower));
marks.rightElbow.position.copy(pos(right.lower));
marks.leftWrist.position.copy(pos(left.hand));
marks.rightWrist.position.copy(pos(right.hand));

const el=pos(left.hand).distanceTo(leftTarget);
const er=pos(right.hand).distanceTo(rightTarget);

document.getElementById('debug').textContent=
`Wrist error L/R: ${el.toFixed(3)} / ${er.toFixed(3)} · Green/Pink = elbows`;
}

function updatePose(){
if(!guardian||!sword)return;

restore();

if(mode==='natural'){
natural();
sword.visible=false;
markerGroup.visible=false;
document.getElementById('debug').textContent=
'Locked Natural Guardian Stance';
}else{
sword.visible=true;
markerGroup.visible=showMarkers;
swordPose();
}
}

function changeMode(m){
mode=m;

document.getElementById('unarmed')
.classList.toggle('active',m==='natural');

document.getElementById('longsword')
.classList.toggle('active',m==='sword');

document.getElementById('weaponControls').style.display=
m==='sword'?'block':'none';

updatePose();
}

document.getElementById('unarmed').onclick=()=>changeMode('natural');
document.getElementById('longsword').onclick=()=>changeMode('sword');

document.getElementById('breath').onclick=()=>{
breathing=!breathing;
document.getElementById('breath').textContent=
breathing?'Breathing ON':'Breathing OFF';
};

document.getElementById('markers').onclick=()=>{
showMarkers=!showMarkers;
document.getElementById('markers').textContent=
showMarkers?'Markers ON':'Markers OFF';
updatePose();
};

document.getElementById('reset').onclick=()=>{
camera.position.set(0,1.45,9);
controls.target.set(0,1.25,0);
controls.update();
};

new GLTFLoader().load(
'../guardian-3d-test/Superhero_Male_FullBody.gltf',
gltf=>{
guardian=gltf.scene;

const box=new THREE.Box3().setFromObject(guardian);
const size=box.getSize(V());
const center=box.getCenter(V());

guardian.position.sub(center);
guardian.scale.setScalar(2.5/Math.max(size.y,.001));
guardian.position.y+=1.25;

scene.add(guardian);
updateWorld();
capture();
sword=createSword();

document.getElementById('status').textContent=
`Guardian loaded · ${Object.keys(bones).length} bones · Test 3I.9`;

updatePose();
},
undefined,
e=>{
console.error(e);
document.getElementById('status').textContent=
'Guardian load failed — check GLTF path';
}
);

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);

if(guardian&&sword){
updatePose();

if(breathing){
const spine=bone('spine_02');

if(spine){
const phase=Math.sin(
clock.getElapsedTime()*Math.PI*2/4.2
);
spine.rotateX(phase*.018*.55);
updateWorld();
}
}
}

controls.update();
renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
 </html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Test 3E</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:#172334;
 color:#f4e4c2;
 font:14px system-ui,sans-serif;
}

#scene{
 position:fixed;
 inset:0;
}

#panel{
 position:fixed;
 top:12px;
 left:12px;
 right:12px;
 padding:12px 15px;
 border:1px solid #9b7b43;
 border-radius:12px;
 background:rgba(13,20,30,.92);
 pointer-events:none;
}

h1{
 margin:0 0 5px;
 font-size:17px;
 color:#e9c77c;
}

#status{
 font-size:12px;
 line-height:1.5;
 white-space:pre-line;
}

#controls{
 position:fixed;
 bottom:14px;
 left:12px;
 right:12px;
 padding:12px;
 text-align:center;
 background:rgba(13,20,30,.9);
 border-radius:10px;
}

button{
 padding:10px 18px;
 margin-bottom:8px;
 border:1px solid #dfbd7d;
 border-radius:8px;
 background:#916b35;
 color:white;
 font-weight:700;
}

#info{
 font-size:12px;
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<div id="scene"></div>

<div id="panel">
 <h1>LIFE RPG — Guardian Test 3E</h1>
 <div id="status">Starting 3D engine...</div>
</div>

<div id="controls">
 <button id="reset">Reset Camera</button>
 <div id="info">
  Drag to rotate · Pinch to zoom
  <div>Build 0.5.4 — Test 3E</div>
 </div>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const status=document.getElementById("status");
const container=document.getElementById("scene");

function setStatus(message){
 status.textContent=message;
}

window.addEventListener("error",e=>{
 setStatus("ERROR: "+e.message);
});

window.addEventListener("unhandledrejection",e=>{
 setStatus("ERROR: "+String(e.reason));
});

try{

 const scene=new THREE.Scene();
 scene.background=new THREE.Color(0x172334);

 const camera=new THREE.PerspectiveCamera(
  40,
  innerWidth/innerHeight,
  0.01,
  1000
 );

 const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.7)
 );

 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;

 container.appendChild(renderer.domElement);

 const controls=new OrbitControls(
  camera,
  renderer.domElement
 );

 controls.enableDamping=true;
 controls.enablePan=false;
 controls.minPolarAngle=0.2;
 controls.maxPolarAngle=Math.PI-0.2;

 scene.add(
  new THREE.HemisphereLight(
   0xffffff,
   0x566070,
   2.2
  )
 );

 const light=new THREE.DirectionalLight(
  0xffe6bd,
  3
 );

 light.position.set(3,6,5);
 scene.add(light);

 const ground=new THREE.Mesh(
  new THREE.CircleGeometry(2.5,64),
  new THREE.MeshStandardMaterial({
   color:0x344139,
   roughness:1
  })
 );

 ground.rotation.x=-Math.PI/2;
 ground.position.y=-0.02;
 scene.add(ground);

 let guardian=null;
 let finalBounds=null;

 function fitCamera(){

  if(!guardian)return;

  // Update every transform before measuring.
  guardian.updateMatrixWorld(true);

  const bounds=new THREE.Box3()
   .setFromObject(guardian,true);

  const size=bounds.getSize(
   new THREE.Vector3()
  );

  const center=bounds.getCenter(
   new THREE.Vector3()
  );

  finalBounds=bounds.clone();

  // Use a simple full-body framing calculation.
  const verticalFOV=THREE.MathUtils.degToRad(
   camera.fov
  );

  const horizontalFOV=2*Math.atan(
   Math.tan(verticalFOV/2)*camera.aspect
  );

  const distanceV=
   size.y/(2*Math.tan(verticalFOV/2));

  const distanceH=
   size.x/(2*Math.tan(horizontalFOV/2));

  // Include model depth and extra framing space.
  const distance=
   Math.max(distanceV,distanceH)*
   1.6+size.z;

  // Reset the camera to a known front-facing view.
  controls.enableDamping=false;

  controls.target.copy(center);

  camera.position.set(
   center.x,
   center.y,
   center.z+distance
  );

  camera.up.set(0,1,0);
  camera.lookAt(center);

  controls.minDistance=Math.max(
   size.y*0.5,
   0.5
  );

  controls.maxDistance=Math.max(
   distance*5,
   30
  );

  camera.near=0.01;
  camera.far=Math.max(distance*30,100);
  camera.updateProjectionMatrix();

  controls.update();
  controls.enableDamping=true;

  setStatus(
   "Model height: "+size.y.toFixed(2)+
   "\nModel width: "+size.x.toFixed(2)+
   "\nCenter Y: "+center.y.toFixed(2)+
   "\nCamera Y: "+camera.position.y.toFixed(2)+
   "\nDistance: "+distance.toFixed(2)
  );

 }

 document.getElementById("reset").onclick=()=>{
  fitCamera();
 };

 setStatus("Loading Guardian model...");

 const loader=new GLTFLoader();

 loader.load(

  "../guardian-3d-test/Superhero_Male_FullBody.gltf",

  gltf=>{

   guardian=gltf.scene;

   guardian.updateMatrixWorld(true);

   // Measure original model.
   const originalBounds=new THREE.Box3()
    .setFromObject(guardian,true);

   const originalSize=originalBounds.getSize(
    new THREE.Vector3()
   );

   if(originalSize.y<=0){
    setStatus("ERROR: Invalid model dimensions");
    return;
   }

   // Scale to standard Guardian height.
   guardian.scale.multiplyScalar(
    2.5/originalSize.y
   );

   guardian.updateMatrixWorld(true);

   // Position model after scaling.
   const scaledBounds=new THREE.Box3()
    .setFromObject(guardian,true);

   const scaledCenter=scaledBounds.getCenter(
    new THREE.Vector3()
   );

   guardian.position.x-=scaledCenter.x;
   guardian.position.z-=scaledCenter.z;
   guardian.position.y-=scaledBounds.min.y;

   guardian.updateMatrixWorld(true);

   scene.add(guardian);

   // Fit after all transformations.
   fitCamera();

  },

  undefined,

  error=>{
   console.error(error);

   setStatus(
    "MODEL ERROR: "+
    (error.message||String(error))
   );
  }

 );

 addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

  fitCamera();

 });

 renderer.setAnimationLoop(()=>{

  controls.update();

  renderer.render(
   scene,
   camera
  );

 });

}catch(error){

 setStatus(
  "ENGINE ERROR: "+error.message
 );

}

</script>

</body>
</html>

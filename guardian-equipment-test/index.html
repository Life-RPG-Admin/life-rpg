
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Test 3I.8</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101722;
 color:#f3e4c5;
 font:13px system-ui,sans-serif;
 overflow:hidden;
}
#scene{position:fixed;inset:0}
#top{
 position:fixed;
 top:8px;left:8px;right:8px;
 background:#111b2be8;
 border:1px solid #a88b55;
 border-radius:10px;
 padding:9px;
 pointer-events:none;
}
h3{margin:0 0 4px;color:#e8c47a;font-size:15px}
#status,#debug{font-size:11px;line-height:1.5}
#debug{color:#b8c9d5}
#panel{
 position:fixed;
 bottom:8px;left:8px;right:8px;
 max-height:38vh;
 overflow:auto;
 background:#101a2be8;
 border:1px solid #a88b55;
 border-radius:12px;
 padding:10px;
}
button{
 background:#29394d;
 color:white;
 border:1px solid #b99a59;
 border-radius:7px;
 padding:9px;
 margin:3px;
}
button.active{background:#765d30}
.setting{
 display:grid;
 grid-template-columns:100px 1fr 35px;
 gap:7px;
 align-items:center;
 margin:9px 0;
}
input[type=range]{
 width:100%;
 accent-color:#d6ad64;
}
small{color:#afbdca}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>

<div id="scene"></div>

<div id="top">
 <h3>LIFE RPG — Guardian 3I.8</h3>
 <div id="status">Loading Guardian...</div>
 <div id="debug">Arm IK Reconstruction</div>
</div>

<div id="panel">
 <div>
  <button id="unarmed">Unarmed</button>
  <button id="longsword" class="active">Longsword</button>
  <button id="breath">Breathing ON</button>
  <button id="markers">Markers ON</button>
  <button id="reset">Reset Camera</button>
 </div>
 <div id="weaponControls">
  <small>Equipment stance development controls</small>
  <div id="sliders"></div>
 </div>
</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,.05,100
);
camera.position.set(0,1.45,9);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.25,0);
controls.enableDamping=true;
controls.minDistance=2.5;
controls.maxDistance=30;
controls.update();

scene.add(new THREE.HemisphereLight(0xeaf2ff,0x394457,2.3));

const sun=new THREE.DirectionalLight(0xffe4bc,2.5);
sun.position.set(3,7,6);
scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(3.4,64),
 new THREE.MeshStandardMaterial({color:0x273445})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.025;
scene.add(floor);

let guardian=null;
let sword=null;
let mode="sword";
let breathing=true;
let showMarkers=true;

const bones={};
const originals=new Map();

const settings={
 angle:35,
 forward:40,
 height:38,
 spacing:22,
 wrist:35,
 curl:70
};

const sliderConfig=[
 ["angle","Blade Angle",10,65],
 ["forward","Grip Forward",10,65],
 ["height","Grip Height",10,65],
 ["spacing","Hand Spacing",12,35],
 ["wrist","Wrist Correction",0,100],
 ["curl","Finger Curl",0,100]
];

for(const [key,label,min,max] of sliderConfig){
 const row=document.createElement("div");
 row.className="setting";

 const name=document.createElement("span");
 name.textContent=label;

 const input=document.createElement("input");
 input.type="range";
 input.min=min;
 input.max=max;
 input.value=settings[key];

 const value=document.createElement("span");
 value.textContent=input.value;

 input.oninput=()=>{
  settings[key]=Number(input.value);
  value.textContent=input.value;
  updatePose();
 };

 row.append(name,input,value);
 document.getElementById("sliders").appendChild(row);
}

function positionOf(bone){
 return bone.getWorldPosition(V());
}

function getBone(name){
 return bones[name]||null;
}

function captureSkeleton(){
 guardian.traverse(o=>{
  if(o.isBone){
   bones[o.name.toLowerCase()]=o;
   originals.set(o,o.quaternion.clone());
  }
 });
}

function restoreSkeleton(){
 for(const [bone,q] of originals){
  bone.quaternion.copy(q);
 }
 guardian.updateMatrixWorld(true);
}

function applyNaturalPose(){
 const l=getBone("upperarm_l");
 const r=getBone("upperarm_r");

 if(l)l.rotateZ(-1.35);
 if(r)r.rotateZ(1.35);

 for(const side of ["l","r"]){
  const fore=getBone("lowerarm_"+side);
  const hand=getBone("hand_"+side);
  if(fore)fore.rotateX(.46*.18);
  if(hand)hand.rotateX(.19*.14);
 }

 for(const [name,bone] of Object.entries(bones)){
  if(/finger|thumb|index|middle|ring|pinky/.test(name)){
   bone.rotateX(.66*.35);
  }
 }

 guardian.updateMatrixWorld(true);
}

function makeSword(){
 const group=new THREE.Group();

 const steel=new THREE.MeshStandardMaterial({
  color:0xcbd6df,
  metalness:.8,
  roughness:.28
 });
 const leather=new THREE.MeshStandardMaterial({
  color:0x35251a,
  roughness:.85
 });
 const gold=new THREE.MeshStandardMaterial({
  color:0xbfa16a,
  metalness:.7,
  roughness:.3
 });

 function cylinder(rt,rb,h,y,mat){
  const mesh=new THREE.Mesh(
   new THREE.CylinderGeometry(rt,rb,h,12),
   mat
  );
  mesh.position.y=y;
  group.add(mesh);
 }

 // Grip occupies negative local Y.
 cylinder(.024,.026,.48,-.16,leather);
 cylinder(.045,.045,.055,-.43,gold);
 cylinder(.029,.029,.04,.08,gold);

 const guard=new THREE.Mesh(
  new THREE.BoxGeometry(.39,.045,.075),gold
 );
 guard.position.y=.12;
 group.add(guard);

 const blade=new THREE.Mesh(
  new THREE.BoxGeometry(.09,1.25,.035),steel
 );
 blade.position.y=.77;
 group.add(blade);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.064,.2,4),steel
 );
 tip.position.y=1.49;
 tip.rotation.y=Math.PI/4;
 group.add(tip);

 scene.add(group);
 return group;
}

const markerGroup=new THREE.Group();
scene.add(markerGroup);

function makeMarker(color,radius=.032){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(radius,12,8),
  new THREE.MeshBasicMaterial({
   color,
   depthTest:false
  })
 );
 markerGroup.add(m);
 return m;
}

const markers={
 leftTarget:makeMarker(0x00e5ff),
 rightTarget:makeMarker(0xff9b33),
 leftHand:makeMarker(0x00ff66,.022),
 rightHand:makeMarker(0xff33cc,.022)
};

// Convert a desired WORLD rotation into a bone-local rotation.
// All positions are measured after the scaled Guardian has
// updated its world matrices.
function rotateJointToward(joint,endBone,target,weight=1){
 guardian.updateMatrixWorld(true);

 const jointPos=positionOf(joint);
 const endPos=positionOf(endBone);

 const current=endPos.sub(jointPos).normalize();
 const desired=target.clone().sub(jointPos).normalize();

 if(current.lengthSq()<.001||desired.lengthSq()<.001)return;

 const worldDelta=new THREE.Quaternion()
  .setFromUnitVectors(current,desired);

 const parentWorld=joint.parent.getWorldQuaternion(
  new THREE.Quaternion()
 );

 const jointWorld=joint.getWorldQuaternion(
  new THREE.Quaternion()
 );

 const correctedWorld=worldDelta.multiply(jointWorld);

 const correctedLocal=parentWorld.invert()
  .multiply(correctedWorld);

 joint.quaternion.slerp(correctedLocal,weight);
 guardian.updateMatrixWorld(true);
}

// CCD IK: alternate elbow and shoulder adjustments.
// Unlike the previous geometric solver, this operates on
// the real world-space joint positions of the loaded rig.
function solveArm(side,target){
 const upper=getBone("upperarm_"+side);
 const lower=getBone("lowerarm_"+side);
 const hand=getBone("hand_"+side);

 if(!upper||!lower||!hand)return null;

 guardian.updateMatrixWorld(true);

 const shoulder=positionOf(upper);
 const elbow=positionOf(lower);
 const wrist=positionOf(hand);

 const upperLength=shoulder.distanceTo(elbow);
 const lowerLength=elbow.distanceTo(wrist);
 const maxReach=(upperLength+lowerLength)*.96;

 const desired=target.clone().sub(shoulder);
 if(desired.length()>maxReach){
  desired.setLength(maxReach);
 }

 const reachableTarget=shoulder.clone().add(desired);

 // Eight iterations provide a practical starting point.
 for(let i=0;i<8;i++){
  rotateJointToward(lower,hand,reachableTarget,.85);
  rotateJointToward(upper,hand,reachableTarget,.75);
 }

 guardian.updateMatrixWorld(true);

 return {
  hand,
  target:reachableTarget,
  error:positionOf(hand).distanceTo(reachableTarget)
 };
}

function correctWrist(hand,axis,amount){
 const currentWorld=hand.getWorldQuaternion(
  new THREE.Quaternion()
 );

 const localPalm=V(0,1,0).applyQuaternion(currentWorld);

 const delta=new THREE.Quaternion()
  .setFromUnitVectors(
   localPalm.normalize(),
   axis.clone().normalize()
  );

 const desiredWorld=delta.multiply(currentWorld);

 const parentWorld=hand.parent.getWorldQuaternion(
  new THREE.Quaternion()
 );

 const desiredLocal=parentWorld.invert()
  .multiply(desiredWorld);

 hand.quaternion.slerp(desiredLocal,amount);
 guardian.updateMatrixWorld(true);
}

function curlWeaponFingers(){
 for(const [name,bone] of Object.entries(bones)){
  if(/finger|thumb|index|middle|ring|pinky/.test(name)){
   // Natural curl already applied.
   // Add weapon-specific closing only.
   bone.rotateX(settings.curl/100*.25);
  }
 }
}

function applySwordPose(){
 const leftUpper=getBone("upperarm_l");
 const rightUpper=getBone("upperarm_r");

 if(!leftUpper||!rightUpper)return;

 guardian.updateMatrixWorld(true);

 const L=positionOf(leftUpper);
 const R=positionOf(rightUpper);
 const center=L.clone().add(R).multiplyScalar(.5);

 // Use shoulder-derived world coordinates.
 // Grip sits below shoulders and in front of the torso.
 const gripCenter=V(
  center.x,
  center.y-settings.height/100,
  center.z+settings.forward/100
 );

 // Local sword Y points toward the blade tip.
 const radians=THREE.MathUtils.degToRad(settings.angle);
 const axis=V(
  Math.sin(radians),
  Math.cos(radians),
  .18
 ).normalize();

 sword.position.copy(gripCenter);
 sword.quaternion.setFromUnitVectors(V(0,1,0),axis);
 sword.updateMatrixWorld(true);

 // Two grip points on the handle, with separation
 // kept within the physical handle length.
 const spacing=settings.spacing/100;

 const leftGrip=gripCenter.clone()
  .addScaledVector(axis,spacing*.5);

 const rightGrip=gripCenter.clone()
  .addScaledVector(axis,-spacing*.5);

 // Small lateral offsets for distinct wrist bones.
 const leftTarget=leftGrip.clone().add(V(-.035,0,.015));
 const rightTarget=rightGrip.clone().add(V(.035,0,.015));

 markers.leftTarget.position.copy(leftTarget);
 markers.rightTarget.position.copy(rightTarget);

 const leftResult=solveArm("l",leftTarget);
 const rightResult=solveArm("r",rightTarget);

 if(!leftResult||!rightResult)return;

 correctWrist(
  leftResult.hand,axis,settings.wrist/100*.35
 );
 correctWrist(
  rightResult.hand,axis,settings.wrist/100*.35
 );

 curlWeaponFingers();

 guardian.updateMatrixWorld(true);

 markers.leftHand.position.copy(positionOf(leftResult.hand));
 markers.rightHand.position.copy(positionOf(rightResult.hand));

 const errorL=positionOf(leftResult.hand)
  .distanceTo(leftTarget);
 const errorR=positionOf(rightResult.hand)
  .distanceTo(rightTarget);

 document.getElementById("debug").textContent=
  "Grip error L/R: "+
  errorL.toFixed(3)+" / "+
  errorR.toFixed(3)+
  " | World-space CCD";
}

function updatePose(){
 if(!guardian||!sword)return;

 restoreSkeleton();

 // Always begin from the approved natural stance.
 applyNaturalPose();

 if(mode==="natural"){
  sword.visible=false;
  markerGroup.visible=false;
  document.getElementById("debug").textContent=
   "Locked Natural Guardian Stance";
 }else{
  sword.visible=true;
  markerGroup.visible=showMarkers;
  applySwordPose();
 }
}

function changeMode(next){
 mode=next;

 document.getElementById("unarmed")
  .classList.toggle("active",mode==="natural");

 document.getElementById("longsword")
  .classList.toggle("active",mode==="sword");

 document.getElementById("weaponControls").style.display=
  mode==="sword"?"block":"none";

 updatePose();
}

document.getElementById("unarmed").onclick=()=>
 changeMode("natural");

document.getElementById("longsword").onclick=()=>
 changeMode("sword");

document.getElementById("breath").onclick=()=>{
 breathing=!breathing;
 document.getElementById("breath").textContent=
  breathing?"Breathing ON":"Breathing OFF";
};

document.getElementById("markers").onclick=()=>{
 showMarkers=!showMarkers;
 document.getElementById("markers").textContent=
  showMarkers?"Markers ON":"Markers OFF";
 updatePose();
};

document.getElementById("reset").onclick=()=>{
 camera.position.set(0,1.45,9);
 controls.target.set(0,1.25,0);
 controls.update();
};

const loader=new GLTFLoader();

loader.load(
 "../guardian-3d-test/Superhero_Male_FullBody.gltf",
 gltf=>{
  guardian=gltf.scene;

  const box=new THREE.Box3().setFromObject(guardian);
  const size=box.getSize(V());
  const center=box.getCenter(V());

  guardian.position.sub(center);
  guardian.scale.setScalar(2.5/Math.max(size.y,.001));
  guardian.position.y+=1.25;

  scene.add(guardian);
  guardian.updateMatrixWorld(true);

  captureSkeleton();
  sword=makeSword();

  document.getElementById("status").textContent=
   "Guardian loaded · "+
   Object.keys(bones).length+
   " bones · Test 3I.8";

  updatePose();
 },
 undefined,
 err=>{
  console.error(err);
  document.getElementById("status").textContent=
   "Guardian load failed — check asset path";
 }
);

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 if(guardian&&sword){
  updatePose();

  if(breathing){
   const spine=getBone("spine_02");
   if(spine){
    const phase=Math.sin(
     clock.getElapsedTime()*Math.PI*2/4.2
    );
    spine.rotateX(phase*.018*.55);
    guardian.updateMatrixWorld(true);
   }
  }
 }

 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
 </html>

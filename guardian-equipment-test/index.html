
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Test 3G.1</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#172334;color:#f4e4c2;font:14px system-ui,sans-serif}
#scene{position:fixed;inset:0}
#panel{
 position:fixed;top:10px;left:12px;right:12px;
 padding:10px 14px;border:1px solid #9b7b43;
 border-radius:12px;background:rgba(13,20,30,.92);
 pointer-events:none;
}
h1{margin:0 0 5px;font-size:17px;color:#e9c77c}
#status{font-size:12px;line-height:1.45;white-space:pre-line}
#controls{
 position:fixed;bottom:12px;left:12px;right:12px;
 padding:12px;background:rgba(13,20,30,.92);
 border-radius:12px;text-align:center;
}
.buttons{
 display:flex;gap:7px;justify-content:center;
 flex-wrap:wrap;margin-bottom:8px;
}
button{
 padding:10px 12px;border:1px solid #dfbd7d;
 border-radius:8px;background:#916b35;
 color:white;font-weight:700;font-size:12px;
}
button:active{background:#b58b4c}
.adjust{
 display:flex;align-items:center;gap:10px;
 justify-content:center;margin:8px 0;font-size:12px;
}
.adjust label{min-width:105px;text-align:left}
input[type=range]{
 flex:1;min-width:0;accent-color:#d6ad65;
}
.value{min-width:38px;text-align:right}
#info{font-size:11px;line-height:1.5}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="scene"></div>

<div id="panel">
 <h1>LIFE RPG — Guardian Test 3G.1</h1>
 <div id="status">Starting 3D engine...</div>
</div>

<div id="controls">
 <div class="buttons">
  <button id="reset">Reset Camera</button>
  <button id="stance">Stance: Natural</button>
  <button id="breathing">Breathing: On</button>
  <button id="diagnostic">Motion: Natural</button>
 </div>

 <div class="adjust">
  <label>Arm Relaxation</label>
  <input id="armSlider" type="range"
   min="0" max="100" value="75">
  <span class="value" id="armValue">75%</span>
 </div>

 <div class="adjust">
  <label>Breath Intensity</label>
  <input id="breathSlider" type="range"
   min="0" max="100" value="55">
  <span class="value" id="breathValue">55%</span>
 </div>

 <div id="info">
  Drag to rotate · Pinch to zoom
  <div>Build 0.5.4 — Test 3G.1</div>
 </div>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const status=document.getElementById('status');
const container=document.getElementById('scene');
const armSlider=document.getElementById('armSlider');
const breathSlider=document.getElementById('breathSlider');

function setStatus(s){
 status.textContent=s;
}

window.addEventListener('error',e=>
 setStatus('ERROR: '+e.message)
);

window.addEventListener('unhandledrejection',e=>
 setStatus('ERROR: '+String(e.reason))
);

try{

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x172334);

const camera=new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,.01,1000
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.enablePan=false;
controls.minPolarAngle=.2;
controls.maxPolarAngle=Math.PI-.2;

scene.add(new THREE.HemisphereLight(
 0xffffff,0x566070,2.2
));

const light=new THREE.DirectionalLight(0xffe6bd,3);
light.position.set(3,6,5);
scene.add(light);

const ground=new THREE.Mesh(
 new THREE.CircleGeometry(2.5,64),
 new THREE.MeshStandardMaterial({
  color:0x344139,roughness:1
 })
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.02;
scene.add(ground);

let guardian=null;
let natural=true;
let breathing=true;
let relaxation=.75;
let breathIntensity=.55;
let diagnostic=false;

const bones={};
const originalRotations=new Map();

let leftArm=null;
let rightArm=null;
let spine=null;

function captureSkeleton(root){

 root.traverse(obj=>{
  if(obj.isBone){
   bones[obj.name.toLowerCase()]=obj;
   originalRotations.set(
    obj,obj.quaternion.clone()
   );
  }
 });

 function find(...names){
  for(const n of names){
   if(bones[n.toLowerCase()])
    return bones[n.toLowerCase()];
  }
  return null;
 }

 leftArm=find(
  'upperarm_l','upperarm.l',
  'leftupperarm','left_arm'
 );

 rightArm=find(
  'upperarm_r','upperarm.r',
  'rightupperarm','right_arm'
 );

 spine=find(
  'spine_02','spine_03',
  'spine2','chest','spine'
 );
}

function restorePose(){
 for(const [bone,q] of originalRotations){
  bone.quaternion.copy(q);
 }
}

// Restore the exact working 3F arm rotations.
// Equipment-specific stances can replace this layer later.
function applyUnarmedStance(){

 if(natural&&leftArm&&rightArm){

  const angle=relaxation*1.35;

  leftArm.rotateZ(-angle);
  rightArm.rotateZ(angle);

 }
}

function applyBreathing(t){

 if(!breathing||!natural||!spine)return;

 const wave=Math.sin(t*2*Math.PI/4.2);
 const gain=diagnostic?2.6:1;
 const amplitude=.018*breathIntensity*gain;

 // Skeletal rotation only: no scaling.
 spine.rotateX(wave*amplitude);
}

function applyPose(t){

 if(!guardian)return;

 restorePose();
 applyUnarmedStance();
 applyBreathing(t);

 guardian.updateMatrixWorld(true);
}

function fitCamera(){

 if(!guardian)return;

 guardian.updateMatrixWorld(true);

 const bounds=new THREE.Box3()
  .setFromObject(guardian,true);

 const size=bounds.getSize(
  new THREE.Vector3()
 );

 const center=bounds.getCenter(
  new THREE.Vector3()
 );

 const vFov=THREE.MathUtils.degToRad(camera.fov);
 const hFov=2*Math.atan(
  Math.tan(vFov/2)*camera.aspect
 );

 const distanceV=size.y/(2*Math.tan(vFov/2));
 const distanceH=size.x/(2*Math.tan(hFov/2));

 const distance=
  Math.max(distanceV,distanceH)*1.6+size.z;

 controls.enableDamping=false;
 controls.target.copy(center);

 camera.position.set(
  center.x,
  center.y,
  center.z+distance
 );

 camera.up.set(0,1,0);
 camera.lookAt(center);

 controls.minDistance=Math.max(
  size.y*.5,.5
 );

 controls.maxDistance=Math.max(
  distance*5,30
 );

 camera.near=.01;
 camera.far=Math.max(distance*30,100);
 camera.updateProjectionMatrix();

 controls.update();
 controls.enableDamping=true;
}

document.getElementById('reset').onclick=()=>{
 applyPose(0);
 fitCamera();
};

document.getElementById('stance').onclick=()=>{

 natural=!natural;

 document.getElementById('stance').textContent=
  'Stance: '+(natural?'Natural':'T-Pose');

 updateDiagnostics();
};

document.getElementById('breathing').onclick=()=>{

 breathing=!breathing;

 document.getElementById('breathing').textContent=
  'Breathing: '+(breathing?'On':'Off');
};

document.getElementById('diagnostic').onclick=()=>{

 diagnostic=!diagnostic;

 document.getElementById('diagnostic').textContent=
  'Motion: '+(diagnostic?'Diagnostic':'Natural');
};

armSlider.oninput=()=>{

 relaxation=Number(armSlider.value)/100;

 document.getElementById('armValue').textContent=
  armSlider.value+'%';
};

breathSlider.oninput=()=>{

 breathIntensity=Number(breathSlider.value)/100;

 document.getElementById('breathValue').textContent=
  breathSlider.value+'%';
};

function updateDiagnostics(){

 setStatus(
  'Guardian: Loaded'+
  '\nSkeleton bones: '+originalRotations.size+
  '\nLeft arm: '+(leftArm?'Found':'Missing')+
  '\nRight arm: '+(rightArm?'Found':'Missing')+
  '\nBreathing spine: '+(spine?spine.name:'Missing')+
  '\nStance: '+(natural?'Natural':'T-Pose')
 );
}

setStatus('Loading Guardian model...');

new GLTFLoader().load(
 '../guardian-3d-test/Superhero_Male_FullBody.gltf',

 gltf=>{

  guardian=gltf.scene;

  const originalBounds=new THREE.Box3()
   .setFromObject(guardian,true);

  const originalSize=originalBounds.getSize(
   new THREE.Vector3()
  );

  if(originalSize.y<=0){
   setStatus('ERROR: Invalid model dimensions');
   return;
  }

  guardian.scale.multiplyScalar(
   2.5/originalSize.y
  );

  guardian.updateMatrixWorld(true);

  const scaledBounds=new THREE.Box3()
   .setFromObject(guardian,true);

  const center=scaledBounds.getCenter(
   new THREE.Vector3()
  );

  guardian.position.x-=center.x;
  guardian.position.z-=center.z;
  guardian.position.y-=scaledBounds.min.y;

  guardian.updateMatrixWorld(true);
  scene.add(guardian);

  captureSkeleton(guardian);
  applyPose(0);
  fitCamera();
  updateDiagnostics();

 },

 undefined,

 error=>{
  console.error(error);
  setStatus(
   'MODEL ERROR: '+
   (error.message||String(error))
  );
 }
);

const clock=new THREE.Clock();

renderer.setAnimationLoop(()=>{

 applyPose(clock.getElapsedTime());

 controls.update();
 renderer.render(scene,camera);
});

addEventListener('resize',()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 fitCamera();
});

}catch(error){

 setStatus('ENGINE ERROR: '+error.message);

}
</script>
</body>
</html>

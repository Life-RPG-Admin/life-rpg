
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Living Guardian 3G</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#101722;color:#f5e6c7;
 font:14px system-ui,sans-serif;
}
#scene{position:fixed;inset:0}
#top{
 position:fixed;top:8px;left:8px;
 right:8px;pointer-events:none;
}
h1{
 margin:0;color:#e7c780;
 font-size:16px;text-shadow:0 2px 5px #000;
}
#status{
 font-size:11px;color:#c9d8d5;
 text-shadow:0 2px 4px #000;
}
#controls{
 position:fixed;bottom:8px;
 left:8px;right:8px;
 padding:9px 11px;
 background:#101923e8;
 border:1px solid #b9995877;
 border-radius:12px;
}
button{
 background:#34465b;color:#fff;
 border:1px solid #a88d5b;
 border-radius:7px;
 padding:8px;font-size:12px;
}
button.active{background:#85652e}
.buttons{display:flex;gap:6px}
.buttons button{flex:1}
.control{
 display:flex;align-items:center;
 gap:9px;margin-top:7px;
 font-size:12px;
}
.control label{min-width:85px}
input[type=range]{flex:1;min-width:0}
output{width:35px;text-align:right}
#details{
 font-size:10px;color:#c7d4d6;
 margin-top:5px;
}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>
<body>
<div id="scene"></div>
<div id="top">
 <h1>LIFE RPG · Living Guardian 3G</h1>
 <div id="status">Loading Guardian...</div>
</div>
<div id="controls">
 <div class="buttons">
  <button id="natural" class="active">Natural</button>
  <button id="tpose">T-Pose</button>
  <button id="reset">Reset Camera</button>
 </div>
 <div class="control">
  <label>Arm relaxation</label>
  <input id="arms" type="range"
   min="0" max="100" value="100">
  <output id="armValue">100%</output>
 </div>
 <div class="control">
  <label>Breathing</label>
  <input id="breath" type="checkbox" checked>
  <input id="intensity" type="range"
   min="0" max="100" value="65">
  <output id="breathValue">65%</output>
 </div>
 <div id="details">Waiting for skeleton...</div>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from
 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from
 'three/addons/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(
 35,innerWidth/innerHeight,0.01,1000
);
const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('scene').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
 0xffffff,0x46556a,2.2
));
const light=new THREE.DirectionalLight(
 0xffe5c1,2.4
);
light.position.set(4,8,7);
scene.add(light);

const controls=new OrbitControls(
 camera,renderer.domElement
);
controls.enableDamping=true;
controls.enablePan=true;
controls.minDistance=1;
controls.maxDistance=30;

let guardian=null;
let bones=[];
let boneMap={};
let originals=new Map();
let natural=true;
let armStrength=1;
let breathing=true;
let intensity=.65;
let cameraHome=null;
const clock=new THREE.Clock();

function findBone(...terms){
 return bones.find(b=>
  terms.some(t=>b.name.toLowerCase()===t)
 )||bones.find(b=>
  terms.some(t=>b.name.toLowerCase().includes(t))
 );
}
function captureBones(){
 guardian.traverse(o=>{
  if(o.isBone){
   bones.push(o);
   originals.set(o,o.quaternion.clone());
   boneMap[o.name.toLowerCase()]=o;
  }
 });
}
function restoreBones(){
 for(const [b,q] of originals)b.quaternion.copy(q);
}
function rotateBone(b,axis,angle){
 if(!b)return;
 const q=new THREE.Quaternion()
  .setFromAxisAngle(
   new THREE.Vector3(
    axis==='x'?1:0,
    axis==='y'?1:0,
    axis==='z'?1:0
   ),angle
  );
 b.quaternion.multiply(q);
}
let leftArm,rightArm,leftShoulder,rightShoulder;
let spine,chest,upperChest;
let breathingBones=[];

function identifyBones(){
 leftArm=findBone('upperarm_l','leftupperarm');
 rightArm=findBone('upperarm_r','rightupperarm');
 leftShoulder=findBone('clavicle_l','shoulder_l');
 rightShoulder=findBone('clavicle_r','shoulder_r');
 spine=findBone('spine');
 chest=findBone('spine1','spine_01','chest');
 upperChest=findBone('spine2','spine_02','upperchest');

 breathingBones=[...new Set(
  [spine,chest,upperChest].filter(Boolean)
 )];
 $('details').textContent=
  `${bones.length} bones · `+
  `${breathingBones.length} torso bones · `+
  `Breathing experiment`;
}

function applyPose(t){
 restoreBones();
 if(natural){
  // Preserve the 3F relaxed-arm direction.
  rotateBone(leftArm,'z',1.005*armStrength);
  rotateBone(rightArm,'z',-1.005*armStrength);
 }
 if(!breathing||!natural)return;

 // One slow breathing cycle, about 3.8 seconds.
 const wave=Math.sin(t*Math.PI*2/3.8);
 const inhale=(wave+1)/2;
 const amount=intensity;

 // Controlled ribcage expansion proxy.
 // Test value deliberately amplified for visibility.
 if(chest){
  chest.scale.set(
   1+inhale*.027*amount,
   1+inhale*.012*amount,
   1+inhale*.035*amount
  );
 }
 if(upperChest && upperChest!==chest){
  upperChest.scale.set(
   1+inhale*.025*amount,
   1+inhale*.008*amount,
   1+inhale*.028*amount
  );
 }

 // Small synchronized torso movement.
 if(spine)rotateBone(
  spine,'x',wave*.012*amount
 );
 if(chest)rotateBone(
  chest,'x',wave*.014*amount
 );

 // Shoulders rise slightly on inhalation.
 rotateBone(leftShoulder,'z',inhale*.018*amount);
 rotateBone(rightShoulder,'z',-inhale*.018*amount);
}

function fitCamera(){
 // Preserve the successful 3E world-space
 // bounding-box camera approach.
 guardian.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(guardian,true);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());

 const fov=THREE.MathUtils.degToRad(camera.fov);
 const aspect=camera.aspect;
 const distanceV=(size.y/2)/Math.tan(fov/2);
 const distanceH=(size.x/2)/
  (Math.tan(fov/2)*aspect);
 const distance=Math.max(distanceV,distanceH)*1.6+size.z;

 camera.position.set(
  center.x,center.y,center.z+distance
 );
 controls.target.copy(center);
 controls.minDistance=Math.max(.5,size.y*.35);
 controls.maxDistance=Math.max(30,distance*3);
 camera.near=.01;
 camera.far=1000;
 camera.updateProjectionMatrix();
 controls.update();

 cameraHome={
  position:camera.position.clone(),
  target:controls.target.clone()
 };
}

new GLTFLoader().load(
 '../guardian-3d-test/Superhero_Male_FullBody.gltf',
 gltf=>{
  guardian=gltf.scene;
  scene.add(guardian);

  // Neutralize any initial transforms before fitting.
  const box=new THREE.Box3().setFromObject(guardian,true);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const scale=2.5/Math.max(size.y,.001);
  guardian.scale.multiplyScalar(scale);
  guardian.position.x-=center.x*scale;
  guardian.position.y-=box.min.y*scale;
  guardian.position.z-=center.z*scale;

  guardian.updateMatrixWorld(true);
  captureBones();
  identifyBones();
  fitCamera();

  $('status').textContent=
   'Guardian loaded · Living idle ready';
 },
 undefined,
 error=>{
  $('status').textContent='Model loading failed';
  console.error(error);
 }
);

function setMode(value){
 natural=value;
 $('natural').classList.toggle('active',natural);
 $('tpose').classList.toggle('active',!natural);
}
$('natural').onclick=()=>setMode(true);
$('tpose').onclick=()=>setMode(false);
$('reset').onclick=()=>{
 if(!cameraHome)return;
 camera.position.copy(cameraHome.position);
 controls.target.copy(cameraHome.target);
 controls.update();
};
$('arms').oninput=e=>{
 armStrength=Number(e.target.value)/100;
 $('armValue').textContent=e.target.value+'%';
};
$('breath').onchange=e=>{
 breathing=e.target.checked;
};
$('intensity').oninput=e=>{
 intensity=Number(e.target.value)/100;
 $('breathValue').textContent=e.target.value+'%';
};

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 if(guardian){
  // Reset temporary scale changes every frame.
  for(const b of breathingBones){
   b.scale.set(1,1,1);
  }
  applyPose(t);
 }
 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 // Keep the current orbit/zoom on resize.
});
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LIFE RPG — Test 3I.7</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101722;color:#f5e5c6;
 font:13px system-ui,sans-serif;overflow:hidden;
}
#scene{position:fixed;inset:0}
#top{
 position:fixed;top:8px;left:8px;right:8px;
 background:#111b2bdc;border:1px solid #b99a5955;
 border-radius:10px;padding:9px;pointer-events:none;
}
h3{margin:0 0 3px;color:#e9c57c;font-size:14px}
#status{font-size:11px;color:#c8d4db}
#panel{
 position:fixed;bottom:8px;left:8px;right:8px;
 max-height:39vh;overflow:auto;
 background:#101a2be8;border:1px solid #b99a5966;
 border-radius:12px;padding:10px;
}
button{
 background:#293a50;color:#fff;
 border:1px solid #b99a59;border-radius:7px;
 padding:8px;margin:3px;font-size:12px;
}
button.active{background:#765d30}
.controls{display:flex;flex-wrap:wrap}
.setting{
 display:grid;grid-template-columns:95px 1fr 36px;
 align-items:center;gap:7px;margin:8px 0;
}
input[type=range]{width:100%;accent-color:#d6ad64}
small{color:#aebcca}
#debug{font-size:10px;color:#b4c5d4;margin-top:5px}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="scene"></div>

<div id="top">
 <h3>LIFE RPG — Guardian 3I.7</h3>
 <div id="status">Loading Guardian...</div>
 <div id="debug">Grip & Wrist Correction</div>
</div>

<div id="panel">
 <div class="controls">
  <button id="natural">Unarmed</button>
  <button id="sword" class="active">Longsword</button>
  <button id="breath">Breathing ON</button>
  <button id="markers">Markers ON</button>
  <button id="reset">Reset Camera</button>
 </div>

 <div id="weaponControls">
  <small>Weapon stance calibration — development only</small>
  <div id="sliders"></div>
 </div>
</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,.05,100
);
camera.position.set(0,1.45,9);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("scene").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.25,0);
controls.enableDamping=true;
controls.minDistance=2.5;
controls.maxDistance=30;
controls.update();

scene.add(new THREE.HemisphereLight(0xeaf2ff,0x394457,2.3));
const light=new THREE.DirectionalLight(0xffe4bc,2.5);
light.position.set(3,7,6);
scene.add(light);

const ground=new THREE.Mesh(
 new THREE.CircleGeometry(3.4,64),
 new THREE.MeshStandardMaterial({color:0x273445,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.025;
scene.add(ground);

const settings={
 angle:34,
 separation:30,
 forward:38,
 height:108,
 wrist:45,
 curl:70
};

let guardian=null;
let bones={};
let original=new Map();
let restLengths={};
let swordObject=null;
let markerGroup=new THREE.Group();
scene.add(markerGroup);

let mode="sword";
let breathing=true;
let markers=true;

const status=document.getElementById("status");
const debug=document.getElementById("debug");

const config=[
 ["angle","Blade Angle",10,65,1],
 ["separation","Grip Spacing",18,48,1],
 ["forward","Grip Forward",15,70,1],
 ["height","Grip Height",75,145,1],
 ["wrist","Wrist Alignment",0,100,1],
 ["curl","Finger Curl",0,100,1]
];

for(const [key,label,min,max,step] of config){
 const row=document.createElement("div");
 row.className="setting";
 const name=document.createElement("span");
 name.textContent=label;
 const input=document.createElement("input");
 input.type="range";
 input.min=min;input.max=max;input.step=step;
 input.value=settings[key];
 const value=document.createElement("span");
 value.textContent=input.value;
 input.oninput=()=>{
  settings[key]=Number(input.value);
  value.textContent=input.value;
  updatePose();
 };
 row.append(name,input,value);
 document.getElementById("sliders").appendChild(row);
}

const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);

function worldPos(object){
 return object.getWorldPosition(new THREE.Vector3());
}

function findBone(name){
 return bones[name]||null;
}

function restoreBones(){
 for(const [bone,q] of original){
  bone.quaternion.copy(q);
 }
 guardian.updateMatrixWorld(true);
}

function captureBones(){
 guardian.traverse(o=>{
  if(o.isBone){
   bones[o.name.toLowerCase()]=o;
   original.set(o,o.quaternion.clone());
  }
 });
}

function createSword(){
 const group=new THREE.Group();

 const steel=new THREE.MeshStandardMaterial({
  color:0xc5d3df,metalness:.85,roughness:.25,
  side:THREE.DoubleSide
 });
 const dark=new THREE.MeshStandardMaterial({
  color:0x39291c,roughness:.85
 });
 const gold=new THREE.MeshStandardMaterial({
  color:0xbfa16a,metalness:.75,roughness:.3
 });

 function cylinder(radiusTop,radiusBottom,length,y,material){
  const m=new THREE.Mesh(
   new THREE.CylinderGeometry(radiusTop,radiusBottom,length,12),
   material
  );
  m.position.y=y;
  group.add(m);
  return m;
 }

 // Local Y is the sword's longitudinal axis.
 cylinder(.022,.024,.49,-.17,dark);
 cylinder(.045,.045,.055,-.435,gold);
 cylinder(.029,.029,.04,.075,gold);

 const guard=new THREE.Mesh(
  new THREE.BoxGeometry(.38,.045,.075),gold
 );
 guard.position.y=.105;
 group.add(guard);

 const blade=new THREE.Mesh(
  new THREE.BoxGeometry(.095,1.35,.035),steel
 );
 blade.position.y=.80;
 group.add(blade);

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(.066,.22,4),steel
 );
 tip.position.y=1.585;
 tip.rotation.y=Math.PI/4;
 group.add(tip);

 // Blade runs from guard toward positive Y.
 scene.add(group);
 return group;
}

function marker(color,radius=.035){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(radius,12,8),
  new THREE.MeshBasicMaterial({
   color,depthTest:false,transparent:true,opacity:.9
  })
 );
 markerGroup.add(m);
 return m;
}

const marks={
 left:marker(0x00e5ff),
 right:marker(0xff9b33),
 palmL:marker(0x32ff75,.025),
 palmR:marker(0xff4ac6,.025)
};

function naturalPose(){
 const l=findBone("upperarm_l");
 const r=findBone("upperarm_r");
 if(l)l.rotateZ(-1.35);
 if(r)r.rotateZ(1.35);

 for(const side of ["l","r"]){
  const fore=findBone("lowerarm_"+side);
  const hand=findBone("hand_"+side);
  if(fore)fore.rotateX(.46*.18);
  if(hand)hand.rotateX(.19*.14);
 }

 for(const [name,bone] of Object.entries(bones)){
  if(/finger|thumb|index|middle|ring|pinky/i.test(name)){
   bone.rotateX(.66*.35);
  }
 }
 guardian.updateMatrixWorld(true);
}

function getChain(side){
 const upper=findBone("upperarm_"+side);
 const lower=findBone("lowerarm_"+side);
 const hand=findBone("hand_"+side);
 if(!upper||!lower||!hand)return null;
 return {upper,lower,hand};
}

function lengths(chain){
 return {
  a:chain.upper.getWorldPosition(V()).distanceTo(
   chain.lower.getWorldPosition(V())
  ),
  b:chain.lower.getWorldPosition(V()).distanceTo(
   chain.hand.getWorldPosition(V())
  )
 };
}

// Rotate a bone in world space, converting through its parent.
// The segment's current direction is measured from actual
// joint positions rather than assuming a rig-local axis.
function aimBone(bone,currentDirection,desiredDirection){
 const from=currentDirection.clone().normalize();
 const to=desiredDirection.clone().normalize();
 if(from.lengthSq()<.001||to.lengthSq()<.001)return;

 const delta=new THREE.Quaternion().setFromUnitVectors(from,to);
 const parentQ=bone.parent.getWorldQuaternion(new THREE.Quaternion());
 const currentQ=bone.getWorldQuaternion(new THREE.Quaternion());
 const desiredWorld=delta.multiply(currentQ);
 bone.quaternion.copy(
  parentQ.invert().multiply(desiredWorld)
 );
 bone.updateMatrixWorld(true);
}

// Geometric two-bone IK.
// A separate pole vector controls each elbow.
function solveArm(chain,target,pole){
 const {upper,lower,hand}=chain;
 guardian.updateMatrixWorld(true);

 const shoulder=worldPos(upper);
 const L=lengths(chain);
 if(L.a<.01||L.b<.01)return;

 const reach=target.clone().sub(shoulder);
 const distance=Math.min(
  Math.max(reach.length(),.02),
  L.a+L.b-.008
 );
 const axis=reach.clone().normalize();

 const along=(L.a*L.a-L.b*L.b+distance*distance)/
  (2*distance);
 const radial=Math.sqrt(
  Math.max(0,L.a*L.a-along*along)
 );

 const bend=pole.clone().sub(shoulder);
 bend.addScaledVector(axis,-bend.dot(axis));
 if(bend.lengthSq()<.00001){
  bend.set(0,0,1);
  bend.addScaledVector(axis,-bend.dot(axis));
 }
 bend.normalize();

 const elbow=shoulder.clone()
  .addScaledVector(axis,along)
  .addScaledVector(bend,radial);

 const oldUpper=worldPos(lower).sub(shoulder);
 const newUpper=elbow.clone().sub(shoulder);
 aimBone(upper,oldUpper,newUpper);

 guardian.updateMatrixWorld(true);
 const actualElbow=worldPos(lower);
 const oldFore=worldPos(hand).sub(actualElbow);
 const newFore=target.clone().sub(actualElbow);
 aimBone(lower,oldFore,newFore);
 guardian.updateMatrixWorld(true);
}

// Wrist orientation: align the palm axis with the hilt.
// Blend alignment to avoid forcing extreme twists.
function alignWrist(hand,swordDirection,strength){
 const parentWorld=hand.parent.getWorldQuaternion(
  new THREE.Quaternion()
 );
 const currentWorld=hand.getWorldQuaternion(
  new THREE.Quaternion()
 );

 const palmAxis=V(0,1,0).applyQuaternion(currentWorld);
 const correction=new THREE.Quaternion().setFromUnitVectors(
  palmAxis.normalize(),swordDirection.clone().normalize()
 );
 const desiredWorld=correction.multiply(currentWorld);
 const desiredLocal=parentWorld.invert().multiply(desiredWorld);

 hand.quaternion.slerp(desiredLocal,strength);
 hand.updateMatrixWorld(true);
}

// Grip fingers are applied after the arm IK and wrist alignment.
// Finger bones remain independent of the sword mesh.
function applyGripFingers(){
 const amount=settings.curl/100;
 for(const [name,bone] of Object.entries(bones)){
  if(/finger|thumb|index|middle|ring|pinky/i.test(name)){
   bone.rotateX(amount*.48);
  }
 }
}

function swordPose(){
 const left=getChain("l");
 const right=getChain("r");
 if(!left||!right){
  status.textContent="Missing arm bones — inspect model";
  return;
 }

 // Start from the locked natural pose every update.
 // IK then overrides only the weapon arm chain.
 naturalPose();

 guardian.updateMatrixWorld(true);

 const shoulderL=worldPos(left.upper);
 const shoulderR=worldPos(right.upper);
 const center=shoulderL.clone().add(shoulderR).multiplyScalar(.5);

 const gripHeight=settings.height/100;
 const gripForward=settings.forward/100;
 const separation=settings.separation/100;

 // Positive Z is toward the front of this Guardian.
 const handleCenter=V(
  0,
  gripHeight,
  center.z+gripForward
 );

 // Sword tilts toward the Guardian's right in front view.
 // The tip also projects forward to create a diagonal
 // three-dimensional guard position.
 const angle=THREE.MathUtils.degToRad(settings.angle);
 const swordAxis=V(
  Math.sin(angle),
  Math.cos(angle)*.94,
  .22
 ).normalize();

 swordObject.position.copy(handleCenter);
 swordObject.quaternion.setFromUnitVectors(
  V(0,1,0),swordAxis
 );
 swordObject.updateMatrixWorld(true);

 // Two independent positions along the actual handle.
 // Lower hand sits toward the pommel.
 const lowerGrip=handleCenter.clone()
  .addScaledVector(swordAxis,-separation*.5);
 const upperGrip=handleCenter.clone()
  .addScaledVector(swordAxis,separation*.5);

 // Wrist-bone targets are offset from actual grip contacts.
 // Opposing offsets give each palm its own side of the hilt.
 const leftTarget=upperGrip.clone().add(V(-.055,0,.035));
 const rightTarget=lowerGrip.clone().add(V(.055,0,.035));

 marks.left.position.copy(leftTarget);
 marks.right.position.copy(rightTarget);
 marks.palmL.position.copy(upperGrip);
 marks.palmR.position.copy(lowerGrip);

 // Elbows remain outward and in front of the torso.
 const poleL=shoulderL.clone().add(V(-.38,-.16,.48));
 const poleR=shoulderR.clone().add(V(.38,-.16,.48));

 // Solve each chain independently from its shoulder.
 solveArm(left,leftTarget,poleL);
 solveArm(right,rightTarget,poleR);

 const wristStrength=settings.wrist/100;
 alignWrist(left.hand,swordAxis,wristStrength);
 alignWrist(right.hand,swordAxis,wristStrength);

 applyGripFingers();

 guardian.updateMatrixWorld(true);

 const errorL=worldPos(left.hand).distanceTo(leftTarget);
 const errorR=worldPos(right.hand).distanceTo(rightTarget);

 debug.textContent=
  "Grip errors L/R: "+
  errorL.toFixed(2)+" / "+errorR.toFixed(2)+
  " | 65-bone rig expected";
}

function updatePose(){
 if(!guardian)return;
 restoreBones();

 if(mode==="natural"){
  naturalPose();
  swordObject.visible=false;
  markerGroup.visible=false;
  debug.textContent="Locked Natural Guardian Stance";
 }else{
  swordObject.visible=true;
  markerGroup.visible=markers;
  swordPose();
 }
}

function setMode(next){
 mode=next;
 document.getElementById("natural").classList.toggle(
  "active",mode==="natural"
 );
 document.getElementById("sword").classList.toggle(
  "active",mode==="sword"
 );
 document.getElementById("weaponControls").style.display=
  mode==="sword"?"block":"none";
 updatePose();
}

document.getElementById("natural").onclick=()=>
 setMode("natural");
document.getElementById("sword").onclick=()=>
 setMode("sword");

document.getElementById("breath").onclick=()=>{
 breathing=!breathing;
 document.getElementById("breath").textContent=
  breathing?"Breathing ON":"Breathing OFF";
};

document.getElementById("markers").onclick=()=>{
 markers=!markers;
 document.getElementById("markers").textContent=
  markers?"Markers ON":"Markers OFF";
 markerGroup.visible=markers&&mode==="sword";
};

document.getElementById("reset").onclick=()=>{
 camera.position.set(0,1.45,9);
 controls.target.set(0,1.25,0);
 controls.update();
};

const loader=new GLTFLoader();
loader.load(
 "../guardian-3d-test/Superhero_Male_FullBody.gltf",
 gltf=>{
  guardian=gltf.scene;

  const box=new THREE.Box3().setFromObject(guardian);
  const size=box.getSize(V());
  const center=box.getCenter(V());

  guardian.position.sub(center);
  const scale=2.5/Math.max(size.y,.001);
  guardian.scale.setScalar(scale);
  guardian.position.y+=1.25;

  scene.add(guardian);
  guardian.updateMatrixWorld(true);

  captureBones();
  swordObject=createSword();

  const count=Object.keys(bones).length;
  status.textContent=
   "Guardian loaded · "+count+" bones · Test 3I.7";

  updatePose();
 },
 undefined,
 err=>{
  console.error(err);
  status.textContent="Guardian load failed — check GLTF path";
 }
);

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 if(guardian){
  // Rebuild from original bone rotations every frame.
  // This prevents breathing and grip corrections accumulating.
  updatePose();

  if(breathing){
   const spine=findBone("spine_02");
   if(spine){
    const t=clock.getElapsedTime();
    const phase=Math.sin(t*Math.PI*2/4.2);
    spine.rotateX(phase*.018*.55);
    guardian.updateMatrixWorld(true);
   }
  }
 }

 controls.update();
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
 </html>

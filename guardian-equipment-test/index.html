
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Test 3I.5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#f4e4c2;font-family:system-ui,sans-serif}
#scene{position:fixed;inset:0;touch-action:none}
#panel{position:fixed;top:10px;left:10px;width:min(340px,calc(100vw - 85px));max-height:72dvh;overflow-y:auto;padding:12px;background:#0e141ef0;border:1px solid #806b46;border-radius:12px;z-index:10}
h1{font-size:16px;margin:0 0 5px;color:#e8c57e}
small{display:block;color:#c9bd9f;margin-bottom:10px;line-height:1.4}
button{background:#273649;color:#f4e4c2;border:1px solid #796748;border-radius:7px;padding:9px;font-size:13px}
button.active{background:#775b2c;border-color:#e4bf71}
.buttons{display:flex;gap:6px;margin-bottom:9px}
.buttons button{flex:1}
.control{margin:11px 0}
.control label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
input[type=range]{width:100%;accent-color:#d5ad62}
#status{font-size:11px;color:#b9c7d2;line-height:1.5;margin-top:9px}
#togglePanel{position:fixed;top:10px;right:10px;z-index:11}
#footer{position:fixed;bottom:12px;left:10px;right:10px;text-align:center;pointer-events:none;font-size:11px;color:#d4c49f}
.hidden{display:none!important}
</style>
<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>
<body>
<div id="scene"></div>
<div id="panel">
<h1>⚔️ Guardian — Test 3I.5</h1>
<small>Two-Handed Longsword • Skeleton-Calibrated Grip</small>
<div class="buttons">
<button id="natural" class="active">Unarmed</button>
<button id="longsword">Longsword</button>
</div>
<div class="buttons">
<button id="breathing">Breathing: ON</button>
<button id="resetCamera">Reset Camera</button>
</div>
<div id="weaponControls" class="hidden">
<small>Development sliders only. Unarmed stance remains locked.</small>

<div class="control">
<label>Grip Height <span id="heightValue">0</span></label>
<input id="height" type="range" min="-40" max="40" value="0">
</div>
<div class="control">
<label>Grip Forward <span id="forwardValue">35</span></label>
<input id="forward" type="range" min="0" max="80" value="35">
</div>
<div class="control">
<label>Grip Side <span id="sideValue">0</span></label>
<input id="side" type="range" min="-40" max="40" value="0">
</div>
<div class="control">
<label>Blade Angle <span id="angleValue">38</span></label>
<input id="angle" type="range" min="-65" max="65" value="38">
</div>
<div class="control">
<label>Elbow Spread <span id="spreadValue">28</span></label>
<input id="spread" type="range" min="-100" max="100" value="28">
</div>
<div class="control">
<label>Hand Curl <span id="curlValue">75</span></label>
<input id="curl" type="range" min="0" max="100" value="75">
</div>
<div class="control">
<label>IK Iterations <span id="iterationsValue">12</span></label>
<input id="iterations" type="range" min="4" max="24" value="12">
</div>
<div class="buttons">
<button id="markers">Markers: OFF</button>
<button id="resetWeapon">Reset Stance</button>
</div>
</div>
<div id="status">Loading Guardian...</div>
</div>
<button id="togglePanel">Hide UI</button>
<div id="footer">Drag to orbit · Pinch to zoom</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
document.getElementById("scene").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.enablePan=true;
controls.minDistance=.5;
controls.maxDistance=100;

scene.add(new THREE.HemisphereLight(0xffffff,0x263247,2.5));
const key=new THREE.DirectionalLight(0xffe5b8,3);
key.position.set(3,6,5);scene.add(key);
const fill=new THREE.DirectionalLight(0x8ba9d6,1.5);
fill.position.set(-4,3,-4);scene.add(fill);

const ground=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.MeshStandardMaterial({color:0x24303c,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.015;scene.add(ground);
const grid=new THREE.GridHelper(6,12,0x536071,0x283440);
grid.position.y=-.01;scene.add(grid);

let guardian=null,sword=null,mode="natural",breathingEnabled=true,showMarkers=false;
const bones={},originals=new Map();
const NATURAL=Object.freeze({arms:100,elbows:46,wrists:19,fingers:66,breathing:55});
const settings={height:0,forward:35,side:0,angle:38,spread:28,curl:75,iterations:12};
const defaults={...settings};
const status=document.getElementById("status");
const markers={};
const p=new THREE.Vector3(),q=new THREE.Vector3(),r=new THREE.Vector3();
const worldQ=new THREE.Quaternion(),parentQ=new THREE.Quaternion(),deltaQ=new THREE.Quaternion();
const up=new THREE.Vector3(0,1,0);

function setStatus(s){status.textContent=s}

function findBone(name){
 let found=null;
 guardian.traverse(o=>{if(o.isBone&&o.name.toLowerCase()===name.toLowerCase())found=o});
 return found;
}

function collectBones(){
 bones.leftArm=findBone("upperarm_l");
 bones.rightArm=findBone("upperarm_r");
 bones.leftElbow=findBone("lowerarm_l");
 bones.rightElbow=findBone("lowerarm_r");
 bones.leftHand=findBone("hand_l");
 bones.rightHand=findBone("hand_r");
 bones.spine=findBone("spine_02");
 bones.fingers=[];
 guardian.traverse(o=>{
  if(!o.isBone)return;
  originals.set(o,o.quaternion.clone());
  if(/thumb|index|middle|ring|pinky|little/i.test(o.name))bones.fingers.push(o);
 });
}

function restoreSkeleton(){
 for(const [bone,quat] of originals)bone.quaternion.copy(quat);
}

function applyNaturalPose(){
 bones.leftArm?.rotateZ(-1.35);
 bones.rightArm?.rotateZ(1.35);
 const elbow=NATURAL.elbows/100*.18;
 const wrist=NATURAL.wrists/100*.14;
 const curl=NATURAL.fingers/100*.35;
 bones.leftElbow?.rotateX(elbow);
 bones.rightElbow?.rotateX(elbow);
 bones.leftHand?.rotateX(wrist);
 bones.rightHand?.rotateX(wrist);
 for(const f of bones.fingers)f.rotateX(curl);
}

function applyBreathing(t){
 if(!breathingEnabled||!bones.spine)return;
 bones.spine.rotateX(Math.sin(t*Math.PI*2/4.2)*.018*(NATURAL.breathing/100));
}

function makeSword(){
 const g=new THREE.Group();
 const steel=new THREE.MeshStandardMaterial({color:0xd5dfe9,metalness:.85,roughness:.23});
 const gold=new THREE.MeshStandardMaterial({color:0xc6a45b,metalness:.7,roughness:.28});
 const leather=new THREE.MeshStandardMaterial({color:0x33271e,roughness:.8});
 function part(geo,mat,x,y,z){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);g.add(m);return m;
 }
 part(new THREE.CylinderGeometry(.025,.025,.48,12),leather,0,0,0);
 part(new THREE.SphereGeometry(.045,12,8),gold,0,-.29,0);
 part(new THREE.BoxGeometry(.39,.035,.055),gold,0,.27,0);
 part(new THREE.BoxGeometry(.085,1.05,.028),steel,0,.81,0);
 const tip=part(new THREE.ConeGeometry(.05,.2,4),steel,0,1.42,0);
 tip.rotation.y=Math.PI/4;
 return g;
}

function addMarker(name,color){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(.035,10,8),
  new THREE.MeshBasicMaterial({color,depthTest:false})
 );
 m.renderOrder=999;
 scene.add(m);markers[name]=m;
}

function updateMarkers(targetR,targetL){
 const names=[
  ["shoulderR",bones.rightArm],["elbowR",bones.rightElbow],["handR",bones.rightHand],
  ["shoulderL",bones.leftArm],["elbowL",bones.leftElbow],["handL",bones.leftHand]
 ];
 for(const [name,bone] of names){
  if(bone)bone.getWorldPosition(markers[name].position);
 }
 markers.targetR.position.copy(targetR);
 markers.targetL.position.copy(targetL);
 for(const m of Object.values(markers))m.visible=showMarkers&&mode==="longsword";
}

// World-space CCD rotation.
// Converts the desired world rotation into
// the joint's parent coordinate system.

function aimJoint(joint,hand,target,weight=.7){
 if(!joint||!hand)return;
 joint.updateWorldMatrix(true,true);
 const pivot=joint.getWorldPosition(new THREE.Vector3());
 const end=hand.getWorldPosition(new THREE.Vector3());
 const a=end.sub(pivot).normalize();
 const b=target.clone().sub(pivot).normalize();
 if(a.lengthSq()<.001||b.lengthSq()<.001)return;

 deltaQ.setFromUnitVectors(a,b);
 if(joint.parent)joint.parent.getWorldQuaternion(parentQ);
 else parentQ.identity();

 const localDelta=parentQ.clone().invert().multiply(deltaQ).multiply(parentQ);
 const correction=new THREE.Quaternion().identity().slerp(localDelta,weight);
 joint.quaternion.premultiply(correction);
 joint.updateWorldMatrix(true,true);
}

function solveArm(upper,lower,hand,target,side){
 if(!upper||!lower||!hand)return;

 // Starting position: natural arm relaxation,
 // followed by forward movement.
 upper.rotateZ(side*1.05);
 upper.rotateX(-.5);
 lower.rotateX(.4);
 lower.rotateY(side*settings.spread/100*.18);
 guardian.updateMatrixWorld(true);

 for(let i=0;i<settings.iterations;i++){
  aimJoint(lower,hand,target,.65);
  aimJoint(upper,hand,target,.65);
 }

 // Stop once near target; wrist orientation
 // will be refined after positional alignment.
}

const rightGripLocal=new THREE.Vector3(0,-.12,0);
const leftGripLocal=new THREE.Vector3(0,.12,0);
const rightTarget=new THREE.Vector3();
const leftTarget=new THREE.Vector3();
const shoulderL=new THREE.Vector3();
const shoulderR=new THREE.Vector3();

function updateSwordAndTargets(){
 // Determine the torso position from the
 // actual shoulder bones, not assumed model height.
 bones.leftArm.getWorldPosition(shoulderL);
 bones.rightArm.getWorldPosition(shoulderR);

 const shoulderCenter=shoulderL.clone().add(shoulderR).multiplyScalar(.5);
 const shoulderWidth=shoulderL.distanceTo(shoulderR);

 // Place sword below shoulder center,
 // in front of the character.
 const center=shoulderCenter.clone();
 center.y-=shoulderWidth*.9;
 center.z+=shoulderWidth*(.45+settings.forward/100);
 center.x+=shoulderWidth*settings.side/100;

 center.y+=shoulderWidth*settings.height/100;

 sword.position.copy(center);

 // Positive angle tilts blade to viewer's right.
 sword.rotation.set(
  -.12,
  0,
  -THREE.MathUtils.degToRad(settings.angle)
 );

 sword.updateMatrixWorld(true);

 rightTarget.copy(rightGripLocal);
 leftTarget.copy(leftGripLocal);
 sword.localToWorld(rightTarget);
 sword.localToWorld(leftTarget);
}

function applyLongswordPose(){
 if(!bones.leftArm||!bones.rightArm||!bones.leftHand||!bones.rightHand)return;

 // Start from the locked natural stance as
 // a reliable skeleton baseline.
 applyNaturalPose();
 guardian.updateMatrixWorld(true);

 updateSwordAndTargets();

 // Right hand grips near pommel.
 solveArm(bones.rightArm,bones.rightElbow,bones.rightHand,rightTarget,1);
 // Left hand grips near guard.
 solveArm(bones.leftArm,bones.leftElbow,bones.leftHand,leftTarget,-1);

 for(const f of bones.fingers)f.rotateX(settings.curl/100*.42);
 guardian.updateMatrixWorld(true);
 updateMarkers(rightTarget,leftTarget);
}

function resetCamera(){
 controls.target.set(0,1.25,0);
 camera.position.set(0,1.45,9);
 camera.lookAt(controls.target);
 controls.update();
}

function setMode(next){
 mode=next;
 document.getElementById("natural").classList.toggle("active",mode==="natural");
 document.getElementById("longsword").classList.toggle("active",mode==="longsword");
 document.getElementById("weaponControls").classList.toggle("hidden",mode!=="longsword");
 if(sword)sword.visible=mode==="longsword";
 for(const m of Object.values(markers))m.visible=false;
 setStatus(mode==="natural"?"Locked Natural Guardian Stance":"Longsword IK active — compare hands with grip markers");
}

new GLTFLoader().load(
 "../guardian-3d-test/Superhero_Male_FullBody.gltf",
 gltf=>{
  guardian=gltf.scene;
  scene.add(guardian);
  const box=new THREE.Box3().setFromObject(guardian);
  const h=box.getSize(new THREE.Vector3()).y;
  if(h>0)guardian.scale.setScalar(2.5/h);
  guardian.updateMatrixWorld(true);
  const scaled=new THREE.Box3().setFromObject(guardian);
  guardian.position.y-=scaled.min.y;
  guardian.updateMatrixWorld(true);

  collectBones();
  sword=makeSword();scene.add(sword);sword.visible=false;

  const colors={
   shoulderR:0xff4444,elbowR:0xff8844,handR:0xffff44,
   shoulderL:0x4488ff,elbowL:0x44ffff,handL:0xffffff,
   targetR:0xff00ff,targetL:0x00ff44
  };
  for(const [name,color] of Object.entries(colors))addMarker(name,color);
  for(const m of Object.values(markers))m.visible=false;

  resetCamera();
  setMode("natural");
  setStatus("Guardian loaded. "+bones.fingers.length+" finger bones found. IK calibration ready.");
 },
 undefined,
 err=>{console.error(err);setStatus("Guardian failed to load.")}
);

document.getElementById("natural").onclick=()=>setMode("natural");
document.getElementById("longsword").onclick=()=>setMode("longsword");

document.getElementById("breathing").onclick=()=>{
 breathingEnabled=!breathingEnabled;
 document.getElementById("breathing").textContent=breathingEnabled?"Breathing: ON":"Breathing: OFF";
};

document.getElementById("resetCamera").onclick=resetCamera;

document.getElementById("markers").onclick=()=>{
 showMarkers=!showMarkers;
 document.getElementById("markers").textContent=showMarkers?"Markers: ON":"Markers: OFF";
};

document.getElementById("resetWeapon").onclick=()=>{
 Object.assign(settings,defaults);
 for(const k of Object.keys(settings)){
  document.getElementById(k).value=settings[k];
  document.getElementById(k+"Value").textContent=settings[k];
 }
};

for(const k of Object.keys(settings)){
 const input=document.getElementById(k);
 input.addEventListener("input",()=>{
  settings[k]=Number(input.value);
  document.getElementById(k+"Value").textContent=input.value;
 });
}

document.getElementById("togglePanel").onclick=()=>{
 const hidden=document.getElementById("panel").classList.toggle("hidden");
 document.getElementById("togglePanel").textContent=hidden?"Show UI":"Hide UI";
};

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 if(guardian){
  restoreSkeleton();
  if(mode==="natural"){
   applyNaturalPose();
   if(sword)sword.visible=false;
  }else if(sword){
   sword.visible=true;
   applyLongswordPose();
  }
  applyBreathing(t);
  guardian.updateMatrixWorld(true);
 }
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>

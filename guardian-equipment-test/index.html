
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,
 maximum-scale=1,user-scalable=no">
<title>LIFE RPG — Guardian Build 3K.3.1</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101722;
 color:#f4e4c2;
 font:14px system-ui,sans-serif;
 overflow:hidden;
}
#scene{position:fixed;inset:0}
#panel{
 position:fixed;
 top:10px;
 left:10px;
 width:min(310px,calc(100vw - 20px));
 max-height:85vh;
 overflow:auto;
 background:#111a27ed;
 border:1px solid #8a754b;
 border-radius:12px;
 padding:12px;
 z-index:2;
}
h1{font-size:16px;color:#e9c77c;margin:0 0 5px}
h2{font-size:13px;color:#e9c77c;margin:14px 0 6px}
p{margin:5px 0}
small{color:#b8b8b8}
button{
 background:#34465c;
 color:#fff0d2;
 border:1px solid #92784c;
 border-radius:7px;
 padding:8px;
 margin:3px 2px 3px 0;
 font:inherit;
}
button:active{background:#526d88}
label{
 display:block;
 margin:9px 0;
 font-size:12px;
}
input[type=range]{
 display:block;
 width:100%;
 accent-color:#d4ad66;
}
.value{float:right;color:#e9c77c}
#status{font-size:12px;color:#c9d8e7}
#error{
 display:none;
 white-space:pre-wrap;
 color:#ff9a9a;
 margin-top:8px;
}
#feet{
 background:#1b2938;
 padding:9px;
 border-radius:7px;
 line-height:1.8;
 font-size:12px;
}
#toggleUI{
 position:fixed;
 right:10px;
 top:10px;
 z-index:3;
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>
</head>

<body>
<div id="scene"></div>

<button id="toggleUI">Hide UI</button>

<div id="panel">
<h1>LIFE RPG — Guardian 3K.3.1</h1>
<div id="status">Loading Guardian...</div>
<div id="error"></div>

<p><small>
Upper-body LOCKED · Scale restoration
</small></p>

<button id="resetCamera">Reset Camera</button>
<button id="toggleSword">Sword: ON</button>
<button id="toggleBreathing">Breathing: OFF</button>

<h2>Left Leg</h2>
<div id="leftControls"></div>

<h2>Right Leg</h2>
<div id="rightControls"></div>

<h2>Ground Alignment</h2>
<div id="groundControls"></div>

<button id="alignFoot">Align Lowest Foot</button>

<div id="feet">
Left foot: --<br>
Right foot: --<br>
Difference: --
</div>

<p><small>
Drag to rotate · Pinch to zoom
</small></p>
</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from
 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from
 'three/addons/controls/OrbitControls.js';
import {
 weaponDefinition,
 createGuardianLongsword
} from './weapons/guardian-longsword.js';

const $=id=>document.getElementById(id);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const RAD=Math.PI/180;

function reportError(message){
 $('error').style.display='block';
 $('error').textContent=String(message);
 console.error(message);
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101722);

const camera=new THREE.PerspectiveCamera(
 40,innerWidth/innerHeight,.05,100
);
camera.position.set(0,1.45,9);

const renderer=new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(
 Math.min(devicePixelRatio,2)
);
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('scene').appendChild(renderer.domElement);

const controls=new OrbitControls(
 camera,renderer.domElement
);
controls.target.set(0,1.25,0);
controls.enableDamping=true;
controls.minDistance=2;
controls.maxDistance=30;
controls.update();

scene.add(new THREE.HemisphereLight(
 0xeaf2ff,0x394457,2.3
));

const sun=new THREE.DirectionalLight(
 0xffe4bc,2.5
);
sun.position.set(3,7,6);
scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.CircleGeometry(3.4,64),
 new THREE.MeshStandardMaterial({
  color:0x273445
 })
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.025;
scene.add(floor);

let guardian=null;
let sword=null;
let swordVisible=true;
let breathing=false;
let groundHeight=0;
let ready=false;

const bones={};
const originals=new Map();
const fingers={l:[],r:[]};
const thumbs={l:[],r:[]};

const lockedGrip={
 l:{
  raise:16,
  spread:-21,
  bend:59,
  across:90,
  twist:0,
  wristX:0,
  wristY:-28,
  fingerCurl:84,
  thumbGrip:0
 },
 r:{
  raise:16,
  spread:-22,
  bend:71,
  across:72,
  twist:0,
  wristX:11,
  wristY:45,
  fingerCurl:100,
  thumbGrip:0
 }
};

// Provisional leg calibration values.
const legSettings={
 l:{
  thigh:10,
  spread:-10,
  knee:-10,
  ankle:-10
 },
 r:{
  thigh:10,
  spread:10,
  knee:10,
  ankle:-10
 }
};

const legDefinitions=[
 ['thigh','Thigh Rotation',-45,45],
 ['spread','Hip Spread',-35,35],
 ['knee','Knee Bend',-60,60],
 ['ankle','Ankle Rotation',-40,40]
];

function addSlider(parent,id,label,min,max,value,fn){
 const row=document.createElement('label');
 const valueLabel=document.createElement('span');
 valueLabel.className='value';
 valueLabel.textContent=value+'°';

 const title=document.createElement('span');
 title.textContent=label;

 const slider=document.createElement('input');
 slider.type='range';
 slider.id=id;
 slider.min=min;
 slider.max=max;
 slider.step=1;
 slider.value=value;

 slider.addEventListener('input',()=>{
  const n=Number(slider.value);
  valueLabel.textContent=n+'°';
  fn(n);
 });

 row.append(title,valueLabel,slider);
 parent.appendChild(row);
 return slider;
}

for(const side of ['l','r']){
 const parent=$(
  side==='l'?'leftControls':'rightControls'
 );
 for(const [key,label,min,max] of legDefinitions){
  addSlider(
   parent,
   side+'_'+key,
   label,
   min,max,
   legSettings[side][key],
   n=>{
    legSettings[side][key]=n;
    if(ready)updatePose();
   }
  );
 }
}

const groundSlider=addSlider(
 $('groundControls'),
 'groundHeight',
 'Ground Height',
 -1,1,0,
 n=>{
  groundHeight=n/100;
  if(ready)updatePose();
 }
);

groundSlider.step=1;

function pick(...names){
 for(const name of names){
  if(bones[name])return bones[name];
 }
 return null;
}

function capture(){
 for(const key of Object.keys(bones)){
  delete bones[key];
 }
 originals.clear();
 fingers.l.length=0;
 fingers.r.length=0;
 thumbs.l.length=0;
 thumbs.r.length=0;

 guardian.traverse(object=>{
  if(!object.isBone)return;
  const name=object.name.toLowerCase();
  bones[name]=object;
  originals.set(
   object,
   object.quaternion.clone()
  );

  for(const side of ['l','r']){
   if(name.includes('finger')&&
      name.endsWith('_'+side)){
    fingers[side].push(object);
   }
   if(name.includes('thumb')&&
      name.endsWith('_'+side)){
    thumbs[side].push(object);
   }
  }
 });
}

function resetBones(){
 originals.forEach((q,bone)=>{
  bone.quaternion.copy(q);
 });
}

function rotateBone(name,axis,degrees){
 const bone=bones[name];
 if(!bone)return;
 if(axis==='x')bone.rotateX(degrees*RAD);
 if(axis==='y')bone.rotateY(degrees*RAD);
 if(axis==='z')bone.rotateZ(degrees*RAD);
}

function applyArm(side){
 const p=lockedGrip[side];

 const upper=pick('upperarm_'+side);
 const lower=pick('lowerarm_'+side);
 const hand=pick('hand_'+side);

 if(upper){
  upper.rotateX(p.raise*RAD);
  upper.rotateZ(
   (side==='l'?1:-1)*p.spread*RAD
  );
  upper.rotateY(p.across*RAD);
  upper.rotateX(p.twist*RAD);
 }

 if(lower){
  lower.rotateX(p.bend*RAD);
 }

 if(hand){
  hand.rotateX(p.wristX*RAD);
  hand.rotateY(p.wristY*RAD);
 }

 for(const finger of fingers[side]){
  finger.rotateX(p.fingerCurl*RAD*.42);
 }
}
 
function applyLeg(side){
 const p=legSettings[side];

 const thigh=pick(
  'thigh_'+side,
  'upperleg_'+side
 );
 const calf=pick(
  'calf_'+side,
  'lowerleg_'+side,
  'shin_'+side
 );
 const foot=pick('foot_'+side);

 if(thigh){
  thigh.rotateX(p.thigh*RAD);
  thigh.rotateZ(p.spread*RAD);
 }

 if(calf){
  calf.rotateX(p.knee*RAD);
 }

 if(foot){
  foot.rotateX(p.ankle*RAD);
 }
}

function getFootBone(side){
 return pick(
  'foot_'+side,
  'ankle_'+side,
  'toes_'+side
 );
}

function getFootY(side){
 const foot=getFootBone(side);
 if(!foot)return null;

 guardian.updateMatrixWorld(true);

 const position=V();
 foot.getWorldPosition(position);
 return position.y;
}

function formatHeight(n){
 if(n===null||!Number.isFinite(n)){
  return '--';
 }
 return (n>=0?'+':'')+n.toFixed(3);
}

function updateFeet(){
 if(!guardian)return;

 const left=getFootY('l');
 const right=getFootY('r');

 const floorY=floor.position.y;

 const leftClearance=
  left===null?null:left-floorY;

 const rightClearance=
  right===null?null:right-floorY;

 const difference=
  left===null||right===null
   ?null:Math.abs(left-right);

 $('feet').innerHTML=
  'Left foot: '+formatHeight(leftClearance)+
  '<br>Right foot: '+formatHeight(rightClearance)+
  '<br>Difference: '+formatHeight(difference);
}

function updatePose(time=0){
 if(!guardian)return;

 resetBones();

 applyArm('l');
 applyArm('r');

 applyLeg('l');
 applyLeg('r');

 if(breathing){
  const spine=pick(
   'spine_02','spine_01','spine'
  );
  if(spine){
   spine.rotateX(
    Math.sin(time*Math.PI*2/4.2)*.0099
   );
  }
 }

 guardian.position.y=
  guardian.userData.baseY+groundHeight;

 guardian.updateMatrixWorld(true);

 if(sword){
  sword.visible=swordVisible;
 }

 updateFeet();
}

function alignLowestFoot(){
 if(!ready)return;

 updatePose();

 const left=getFootY('l');
 const right=getFootY('r');

 if(left===null&&right===null){
  reportError('Foot bones not found.');
  return;
 }

 const lowest=Math.min(
  left===null?Infinity:left,
  right===null?Infinity:right
 );

 const correction=floor.position.y-lowest;

 groundHeight+=correction;

 guardian.position.y=
  guardian.userData.baseY+groundHeight;

 guardian.updateMatrixWorld(true);

 const sliderValue=Math.max(
  Number(groundSlider.min),
  Math.min(
   Number(groundSlider.max),
   Math.round(groundHeight*100)
  )
 );

 groundSlider.value=sliderValue;

 const label=groundSlider.parentElement
  .querySelector('.value');

 if(label){
  label.textContent=
   groundHeight.toFixed(3);
 }

 updateFeet();
}

function createSword(){
 if(sword){
  sword.removeFromParent();
  sword=null;
 }

 try{
  sword=createGuardianLongsword();

  if(!sword){
   throw new Error(
    'Longsword factory returned no model.'
   );
  }

  // Keep the weapon as a separate reusable asset.
  // The sword's approved dimensions are
  // defined in guardian-longsword.js.
  const grip=pick('hand_r');

  if(grip){
   grip.add(sword);

   sword.position.set(
    ...weaponDefinition.attachment.gripOffset
   );

   sword.rotation.set(
    0,
    0,
    weaponDefinition.attachment.bladeAngle*RAD
   );
  }else{
   guardian.add(sword);
  }

  sword.visible=swordVisible;

 }catch(error){
  reportError(
   'Longsword error: '+error.message
  );
 }
}

$('alignFoot').onclick=alignLowestFoot;

$('resetCamera').onclick=()=>{
 camera.position.set(0,1.45,9);
 controls.target.set(0,1.25,0);
 controls.update();
};

$('toggleSword').onclick=()=>{
 swordVisible=!swordVisible;

 $('toggleSword').textContent=
  'Sword: '+(swordVisible?'ON':'OFF');

 if(sword)sword.visible=swordVisible;
};

$('toggleBreathing').onclick=()=>{
 breathing=!breathing;

 $('toggleBreathing').textContent=
  'Breathing: '+(breathing?'ON':'OFF');
};

$('toggleUI').onclick=()=>{
 const panel=$('panel');

 const hidden=
  panel.style.display==='none';

 panel.style.display=
  hidden?'block':'none';

 $('toggleUI').textContent=
  hidden?'Hide UI':'Show UI';
};

function loadGuardian(){
 $('status').textContent=
  'Loading Guardian model...';

 new GLTFLoader().load(
  '../guardian-3d-test/Superhero_Male_FullBody.gltf',

  gltf=>{
   try{
    guardian=gltf.scene;

    // BUILD 3K.3.1 SCALE RESTORATION
    // Restore Guardian to 2.5 units tall
    // before capturing bones or measuring feet.

    const box=new THREE.Box3()
     .setFromObject(guardian);

    const size=box.getSize(V());
    const center=box.getCenter(V());

    if(size.y<=0){
     throw new Error(
      'Invalid Guardian model height.'
     );
    }

    guardian.position.sub(center);

    guardian.scale.setScalar(
     2.5/Math.max(size.y,.001)
    );

    guardian.position.y+=1.25;

    // Save the restored base position.
    guardian.userData.baseY=
     guardian.position.y;

    scene.add(guardian);

    guardian.updateMatrixWorld(true);

    capture();

    createSword();

    ready=true;

    updatePose();

    $('status').textContent=
     'Guardian loaded · '+
     Object.keys(bones).length+
     ' bones · READY';

   }catch(error){
    reportError(
     'Guardian setup error: '+
     error.message
    );
   }
  },

  undefined,

  error=>{
   reportError(
    'Guardian loading failed: '+
    (error.message||String(error))
   );
  }
 );
}

const clock=new THREE.Clock();

renderer.setAnimationLoop(()=>{
 const time=clock.getElapsedTime();

 if(ready&&breathing){
  updatePose(time);
 }

 controls.update();
 renderer.render(scene,camera);
});

window.addEventListener('resize',()=>{
 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,innerHeight
 );
});

loadGuardian();

</script>
</body>
</html>

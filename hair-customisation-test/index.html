<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>LIFE RPG — Hair Test 1B</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111822;color:#f1ddae;font:15px system-ui}header{padding:14px 16px}h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:#c5c5c5;margin:5px 0 10px}button{background:#b99454;border:0;border-radius:7px;padding:10px 14px;color:#101820;font-weight:600}#status{font-size:13px;margin-left:8px}#view{width:100%;height:calc(100dvh - 135px);min-height:260px;touch-action:none}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head>
<body><header><h1>LIFE RPG — Hair Test 1B</h1><p>Short Adventurer GLB • Drag to rotate • Pinch to zoom • Standalone preview (Guardian fit not tested)</p><button id="reset">Reset view</button><span id="status">Loading model…</span></header><div id="view"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const el=document.getElementById('view'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111822);
const camera=new THREE.PerspectiveCamera(42,1,0.01,200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;el.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;
scene.add(new THREE.HemisphereLight(0xffffff,0x55402e,2.3));
const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(3,5,4);scene.add(light);
let homePosition=new THREE.Vector3(1,1,2),homeTarget=new THREE.Vector3();
function reset(){camera.position.copy(homePosition);controls.target.copy(homeTarget);controls.update()}
document.getElementById('reset').addEventListener('click',reset);
new GLTFLoader().load('./hair/short-adventurer.glb',g=>{
 const model=g.scene;scene.add(model);
 const bounds=new THREE.Box3().setFromObject(model);if(bounds.isEmpty()){status.textContent='Model has no visible geometry';return}
 const center=bounds.getCenter(new THREE.Vector3());
 model.position.sub(center);model.updateMatrixWorld(true);
 const size=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());
 const radius=Math.max(size.length()/2,.05);
 const vfov=THREE.MathUtils.degToRad(camera.fov);
 const hfov=2*Math.atan(Math.tan(vfov/2)*camera.aspect);
 const distance=radius/Math.sin(Math.min(vfov,hfov)/2)*1.45;
 homeTarget.set(0,0,0);homePosition.set(0,0,distance);
 camera.near=Math.max(distance/1000,.001);camera.far=Math.max(distance+radius*10,10);camera.updateProjectionMatrix();
 controls.minDistance=radius*.8;controls.maxDistance=distance*5;reset();
 status.textContent='Model loaded ✓';
},undefined,e=>{status.textContent='Load failed — check GLB path';console.error(e)});
function resize(){const w=el.clientWidth,h=el.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
window.addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>

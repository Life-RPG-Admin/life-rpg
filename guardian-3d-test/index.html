
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LIFE RPG — Guardian Test 2D</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111923;
      color: #f3e5c5;
      font: 15px system-ui, sans-serif;
      overflow: hidden;
    }
    #view { position: fixed; inset: 0; }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 15px 18px;
      background: linear-gradient(#10151fe8, transparent);
      pointer-events: none;
    }
    h1 { font-size: 18px; margin: 0; color: #e9c77c; }
    #status { font-size: 12px; margin-top: 6px; color: #e0d9cc; }
    footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px;
      background: #10151fdb;
      text-align: center;
      font-size: 12px;
    }
    button {
      background: #a77b3b;
      border: 1px solid #dfbd7d;
      color: white;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
    }
    #actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 8px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>

  <header>
    <h1>LIFE RPG — Guardian Foundation</h1>
    <div id="status">Loading 3D character...</div>
  </header>

  <footer>
    <div id="actions">
      <button id="reset">Reset camera</button>
      <button id="spin">Auto rotate: Off</button>
    </div>
    Drag to rotate · Pinch to zoom · Pose experiment
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const el = document.getElementById('view');
    const status = document.getElementById('status');

    window.addEventListener('error', event => {
      status.textContent = 'JavaScript error: ' + event.message;
    });

    window.addEventListener('unhandledrejection', event => {
      status.textContent = 'Error: ' + String(event.reason);
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#182330');

    const camera = new THREE.PerspectiveCamera(
      35,
      innerWidth / innerHeight,
      0.01,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    el.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdbe8ff, 0x60402d, 2));

    const key = new THREE.DirectionalLight(0xffdfb3, 3);
    key.position.set(3, 6, 5);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x8faedc, 1.8);
    rim.position.set(-4, 3, -4);
    scene.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 0.5;
    controls.maxDistance = 20;

    let spin = false;
    let reset = () => {};

    document.getElementById('spin').onclick = () => {
      spin = !spin;
      controls.autoRotate = spin;
      controls.autoRotateSpeed = 1;
      document.getElementById('spin').textContent =
        'Auto rotate: ' + (spin ? 'On' : 'Off');
    };

    document.getElementById('reset').onclick = () => reset();

    function setGuardianPose(model, relaxed = true) {
      const bones = {};

      model.traverse(obj => {
        if (obj.isBone) {
          bones[obj.name.toLowerCase()] = obj;
        }
      });

      const left = bones['upperarm_l'];
      const right = bones['upperarm_r'];

      if (!left || !right) {
        console.warn('Guardian arm bones not found');
        return false;
      }

      if (!left.userData.originalPose) {
        left.userData.originalPose = left.quaternion.clone();
        right.userData.originalPose = right.quaternion.clone();
      }

      left.quaternion.copy(left.userData.originalPose);
      right.quaternion.copy(right.userData.originalPose);

      if (relaxed) {
        left.rotateZ(-Math.PI / 2.5);
        right.rotateZ(Math.PI / 2.5);
      }

      model.updateMatrixWorld(true);
      return true;
    }

    const loader = new GLTFLoader();

    loader.load(
      './Superhero_Male_FullBody.gltf',

      gltf => {
        try {
          const model = gltf.scene;
          scene.add(model);

          const poseApplied = setGuardianPose(model, true);

          model.updateMatrixWorld(true);

          const bounds = new THREE.Box3().setFromObject(model);
          const center = bounds.getCenter(new THREE.Vector3());
          const size = bounds.getSize(new THREE.Vector3());
          const height = Math.max(size.y, 0.1);

          controls.target.copy(center);

          camera.position.set(
            center.x,
            center.y + height * 0.08,
            center.z + height * 2.5
          );

          camera.near = Math.max(height * 0.001, 0.001);
          camera.far = Math.max(height * 30, 100);
          camera.updateProjectionMatrix();

          controls.minDistance = height * 0.6;
          controls.maxDistance = height * 7;
          controls.update();

          reset = () => {
            controls.target.copy(center);
            camera.position.set(
              center.x,
              center.y + height * 0.08,
              center.z + height * 2.5
            );
            controls.update();
          };

          status.textContent = poseApplied
            ? 'Guardian loaded · Relaxed pose applied'
            : 'Guardian loaded · Arm bones not found (original pose)';
        } catch (error) {
          console.error(error);
          status.textContent = 'Pose/setup error: ' + error.message;
        }
      },

      undefined,

      error => {
        console.error(error);
        status.textContent = 'Model load failed: ' +
          (error.message || String(error));
      }
    );

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIFE RPG — 3K.9A Feminine Model Test</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#f3e4c5;font:13px system-ui;overflow:hidden}#view{position:fixed;inset:0}#top{position:fixed;top:8px;left:8px;right:8px;background:#111b2be9;border:1px solid #aa8d57;border-radius:10px;padding:10px 90px 10px 10px}h3{margin:0 0 5px;color:#e9c67d;font-size:15px}#panel{position:fixed;bottom:8px;left:8px;right:8px;background:#101a2bf2;border:1px solid #aa8d57;border-radius:10px;padding:10px}button{background:#29394d;color:white;border:1px solid #b99a59;border-radius:7px;padding:9px}#hide{position:fixed;right:12px;top:12px;z-index:3}body.hidden #top,body.hidden #panel{display:none}#error{white-space:pre-wrap;color:#ffaaaa}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="view"></div><div id="top"><h3>LIFE RPG — Build 3K.9A</h3><div id="status">Loading feminine Guardian…</div><div id="error"></div></div><button id="hide">Hide UI</button><div id="panel"><button id="reset">Reset Camera</button> <button id="wire">Show Skeleton</button><div style="margin-top:7px">Rotate: drag · Zoom: pinch · Pan: two fingers</div><div style="margin-top:7px;color:#d7b783">Temporary body textures — appearance not final. No stance or weapon calibration in this test.</div></div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const status=document.getElementById('status'),error=document.getElementById('error');const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1;controls.maxDistance=30;scene.add(new THREE.HemisphereLight(0xeaf2ff,0x394457,2.3));const sun=new THREE.DirectionalLight(0xffe4bc,2.5);sun.position.set(3,7,6);scene.add(sun);let model=null,helper=null;function reset(){camera.position.set(0,1.35,7);controls.target.set(0,1.25,0);controls.update()}reset();const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),new THREE.MeshStandardMaterial({color:0x273445}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);new GLTFLoader().load('./Superhero_Female_FullBody.gltf',g=>{model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());if(size.y<=0){error.textContent='Invalid model bounds';return;}model.scale.setScalar(2.5/size.y);model.updateMatrixWorld(true);const fitted=new THREE.Box3().setFromObject(model);model.position.y-=fitted.min.y;const center=fitted.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.updateMatrixWorld(true);let bones=0,meshes=0,skin=0;model.traverse(o=>{if(o.isBone)bones++;if(o.isMesh)meshes++;if(o.isSkinnedMesh)skin++});status.textContent='Model loaded · '+bones+' bones · '+meshes+' meshes · '+skin+' skinned meshes';const skinned=[];model.traverse(o=>{if(o.isSkinnedMesh)skinned.push(o)});if(skinned[0]){helper=new THREE.SkeletonHelper(model);helper.visible=false;scene.add(helper)}reset()},undefined,e=>{status.textContent='Model failed to load';error.textContent=String(e?.message||e)});document.getElementById('reset').onclick=reset;document.getElementById('wire').onclick=e=>{if(!helper)return;helper.visible=!helper.visible;e.target.textContent=helper.visible?'Hide Skeleton':'Show Skeleton'};document.getElementById('hide').onclick=e=>{document.body.classList.toggle('hidden');e.target.textContent=document.body.classList.contains('hidden')?'Show UI':'Hide UI'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();</script></body></html>

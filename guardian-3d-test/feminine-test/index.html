<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIFE RPG — 3K.9B Feminine Natural Stance</title><style>*{box-sizing:border-box}body{margin:0;background:#101722;color:#f3e4c5;font:13px system-ui;overflow:hidden}#view{position:fixed;inset:0}#top{position:fixed;top:8px;left:8px;right:8px;background:#111b2be9;border:1px solid #aa8d57;border-radius:10px;padding:9px 85px 9px 10px}h3{margin:0 0 4px;color:#e9c67d;font-size:15px}#panel{position:fixed;bottom:8px;left:8px;right:8px;max-height:43vh;overflow:auto;background:#101a2bf2;border:1px solid #aa8d57;border-radius:10px;padding:9px}button{background:#29394d;color:white;border:1px solid #b99a59;border-radius:7px;padding:8px;margin:2px}#hide{position:fixed;right:12px;top:12px;z-index:3}body.hidden #top,body.hidden #panel{display:none}.setting{display:flex;align-items:center;gap:8px;margin:6px 0}.setting label{width:125px;flex-shrink:0}.setting input{flex:1;min-width:0}.setting output{width:33px;text-align:right}#error{white-space:pre-wrap;color:#ffaaaa}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="view"></div><div id="top"><h3>LIFE RPG — Build 3K.9B</h3><div id="status">Loading feminine Guardian…</div><div id="error"></div></div><button id="hide">Hide UI</button><div id="panel"><button id="reset">Reset Camera</button><button id="skeleton">Show Skeleton</button><button id="tpose">T-Pose</button><button id="natural">Natural Stance</button><button id="breathing">Breathing: On</button><div id="settings"></div><small>Drag to rotate · Pinch to zoom. Calibration only; settings are not locked.</small></div><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const status=document.getElementById('status'),error=document.getElementById('error');const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('view').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1;controls.maxDistance=30;scene.add(new THREE.HemisphereLight(0xeaf2ff,0x394457,2.3));const sun=new THREE.DirectionalLight(0xffe4bc,2.5);sun.position.set(3,7,6);scene.add(sun);const floor=new THREE.Mesh(new THREE.CircleGeometry(3.4,64),new THREE.MeshStandardMaterial({color:0x273445}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);let model=null,helper=null,mode='natural',breathing=true,bones={},rest={};const vals={armDrop:76,armOut:19,elbow:18,wrist:0,finger:8,breath:55};function resetCamera(){camera.position.set(0,1.35,7);controls.target.set(0,1.25,0);controls.update()}resetCamera();const settings=[['armDrop','Arm lowering',0,100],['armOut','Arm spacing',0,45],['elbow','Elbow bend',0,55],['wrist','Wrist angle',-25,25],['finger','Finger curl',0,55],['breath','Breathing',0,100]];for(const [key,label,min,max] of settings){const div=document.createElement('div');div.className='setting';const lab=document.createElement('label');lab.textContent=label;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=vals[key];const output=document.createElement('output');output.textContent=vals[key];input.oninput=()=>{vals[key]=Number(input.value);output.textContent=input.value;pose()};div.append(lab,input,output);document.getElementById('settings').appendChild(div)}const axisY=new THREE.Vector3(0,1,0),vA=new THREE.Vector3(),vB=new THREE.Vector3(),qA=new THREE.Quaternion(),qB=new THREE.Quaternion();function orientBone(name,childName,desired){const b=bones[name],child=bones[childName];if(!b||!child)return;model.updateMatrixWorld(true);const a=b.getWorldPosition(vA.clone()),c=child.getWorldPosition(vB.clone());const current=c.sub(a).normalize();const desiredDir=desired.clone().normalize();const delta=new THREE.Quaternion().setFromUnitVectors(current,desiredDir);const oldWorld=b.getWorldQuaternion(new THREE.Quaternion());const parentWorld=b.parent.getWorldQuaternion(new THREE.Quaternion());b.quaternion.copy(parentWorld.invert().multiply(delta.multiply(oldWorld)));model.updateMatrixWorld(true)}function restore(){for(const [name,q] of Object.entries(rest)){if(bones[name])bones[name].quaternion.copy(q)}if(bones.spine_03)bones.spine_03.scale.set(1,1,1);model.updateMatrixWorld(true)}function pose(){if(!model)return;restore();if(mode==='tpose')return;for(const side of ['l','r']){const shoulder=bones['upperarm_'+side],elbow=bones['lowerarm_'+side],hand=bones['hand_'+side];if(!shoulder||!elbow||!hand)continue;const s=shoulder.getWorldPosition(new THREE.Vector3()),e=elbow.getWorldPosition(new THREE.Vector3());const sign=Math.sign(e.x-s.x)|| (side==='l'?-1:1);const t=vals.armDrop/100;const spread=vals.armOut/100;const upper=new THREE.Vector3(sign*(1-t+.12+spread*.30),-t*1.35,-.035);orientBone('upperarm_'+side,'lowerarm_'+side,upper);const fore=new THREE.Vector3(sign*(1-t*.8+spread*.12),-t*1.25,vals.elbow/100*.6);orientBone('lowerarm_'+side,'hand_'+side,fore);hand.rotation.z+=(side==='l'?1:-1)*THREE.MathUtils.degToRad(vals.wrist);for(const finger of ['index','middle','ring','pinky','thumb'])for(let i=1;i<=3;i++){const f=bones[finger+'_0'+i+'_'+side];if(f)f.rotation.x+=(side==='l'?1:-1)*THREE.MathUtils.degToRad(vals.finger)*.4}}model.updateMatrixWorld(true)}new GLTFLoader().load('./Superhero_Female_FullBody.gltf',g=>{model=g.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());if(size.y<=0)throw Error('Invalid model bounds');model.scale.setScalar(2.5/size.y);model.updateMatrixWorld(true);const fitted=new THREE.Box3().setFromObject(model);model.position.y-=fitted.min.y;const center=fitted.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.updateMatrixWorld(true);let count=0;model.traverse(o=>{if(o.isBone){bones[o.name]=o;rest[o.name]=o.quaternion.clone();count++}});status.textContent='Model loaded · '+count+' bones · Natural stance calibration';helper=new THREE.SkeletonHelper(model);helper.visible=false;scene.add(helper);pose();resetCamera()},undefined,e=>{status.textContent='Model failed to load';error.textContent=String(e?.message||e)});document.getElementById('reset').onclick=resetCamera;document.getElementById('skeleton').onclick=e=>{if(!helper)return;helper.visible=!helper.visible;e.target.textContent=helper.visible?'Hide Skeleton':'Show Skeleton'};document.getElementById('tpose').onclick=()=>{mode='tpose';pose()};document.getElementById('natural').onclick=()=>{mode='natural';pose()};document.getElementById('breathing').onclick=e=>{breathing=!breathing;e.target.textContent='Breathing: '+(breathing?'On':'Off')};document.getElementById('hide').onclick=e=>{document.body.classList.toggle('hidden');e.target.textContent=document.body.classList.contains('hidden')?'Show UI':'Hide UI'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(t){requestAnimationFrame(animate);if(model&&bones.spine_03){const k=mode==='natural'&&breathing?Math.sin(t*.0017)*vals.breath*.00007:0;bones.spine_03.scale.set(1+k,1+k*.3,1+k)}controls.update();renderer.render(scene,camera)}animate(0);</script></body></html>

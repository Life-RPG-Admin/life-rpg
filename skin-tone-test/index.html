<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE RPG — 3K.11 Skin Tone Test 1</title><style>*{box-sizing:border-box}body{margin:0;background:#101823;color:#f3e4c6;font-family:system-ui}#view{height:68vh;min-height:360px}#panel{padding:12px 16px;background:#1b2635}h2{font-size:17px;margin:4px 0 10px}button{background:#29384b;color:#f4e4c2;border:1px solid #6b614e;border-radius:8px;padding:10px;margin:3px;cursor:pointer}button.active{border:2px solid #edc978;background:#4c4536}.swatch{width:43px;height:43px;border-radius:50%;padding:0;border:2px solid #777}#status{font-size:13px;color:#b5c8d5;margin:8px 0}small{display:block;color:#c4b9a6;line-height:1.5}</style></head><body><div id="view"></div><div id="panel"><h2>Build 3K.11 — Skin Tone Test 1</h2><div><button id="male" class="active">Masculine</button><button id="female">Feminine</button><button id="reset">Original material</button></div><div id="swatches"></div><div id="status">Loading model...</div><small>Diagnostic only: this test tints the full body material, which may include clothing/underwear. It does not yet selectively recolour skin. Orbit: drag. Zoom: pinch.</small></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const tones=[['Porcelain','#F6D9C5'],['Fair Ivory','#EBC6AD'],['Light Beige','#DEB49A'],['Soft Sand','#D3A080'],['Warm Beige','#C68E6D'],['Golden Tan','#B77D55'],['Olive Brown','#A57455'],['Caramel','#96613F'],['Chestnut','#805039'],['Mahogany','#693E2E'],['Espresso','#512F25'],['Deep Ebony','#39241E']];const status=document.querySelector('#status'),view=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,view.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;view.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#151e2b');scene.add(new THREE.HemisphereLight(0xffffff,0x56647a,2.3));const light=new THREE.DirectionalLight(0xffebd2,2.4);light.position.set(3,7,5);scene.add(light);const camera=new THREE.PerspectiveCamera(35,view.clientWidth/view.clientHeight,.01,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let current=null,materials=[],gender='masculine',selection=-1;const loader=new GLTFLoader();function apply(){materials.forEach(({material,original})=>{material.color.copy(original);if(selection>=0){const hex=tones[selection][1];const target=new THREE.Color(hex);/* Diagnostic tint: blend towards selected skin reference while retaining texture */material.color.copy(target)}material.needsUpdate=true});status.textContent=gender+' | '+(selection<0?'Original texture colour':tones[selection][0]+' — full-body material tint (diagnostic)')}function load(g){gender=g;selection=-1;document.querySelector('#male').classList.toggle('active',g==='masculine');document.querySelector('#female').classList.toggle('active',g==='feminine');status.textContent='Loading '+g+' GLTF...';if(current){scene.remove(current);current=null}materials=[];const file=g==='masculine'?'Superhero_Male_FullBody.gltf':'Superhero_Female_FullBody.gltf';loader.load('./models/'+g+'/'+file,asset=>{current=asset.scene;scene.add(current);current.traverse(o=>{if(!o.isMesh)return;const arr=Array.isArray(o.material)?o.material:[o.material];arr.forEach((m,i)=>{if(!m||!(/MI_Superhero/i).test(m.name))return;const cloned=m.clone();if(Array.isArray(o.material))o.material[i]=cloned;else o.material=cloned;materials.push({material:cloned,original:cloned.color.clone()})})});const b=new THREE.Box3().setFromObject(current),sz=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());const max=Math.max(sz.x,sz.y,sz.z);controls.target.copy(center);camera.position.set(center.x+max*.25,center.y+max*.08,center.z+max*2.5);camera.near=Math.max(.001,max/1000);camera.far=max*30;camera.updateProjectionMatrix();controls.update();apply();status.textContent+=' | '+materials.length+' body material(s)';},undefined,e=>{status.textContent='Load failed: '+e.message+'. Open through GitHub Pages or an HTTP server, not file://';console.error(e)})}tones.forEach(([name,hex],i)=>{const b=document.createElement('button');b.className='swatch';b.style.background=hex;b.title=(i+1)+'. '+name;b.setAttribute('aria-label',name);b.onclick=()=>{selection=i;document.querySelectorAll('.swatch').forEach((x,j)=>x.classList.toggle('active',i===j));apply()};document.querySelector('#swatches').append(b)});document.querySelector('#male').onclick=()=>load('masculine');document.querySelector('#female').onclick=()=>load('feminine');document.querySelector('#reset').onclick=()=>{selection=-1;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));apply()};window.addEventListener('resize',()=>{camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();renderer.setSize(view.clientWidth,view.clientHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});load('masculine');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE RPG — 3K.11 Skin Tone Test 2</title><style>*{box-sizing:border-box}body{margin:0;background:#101823;color:#f3e4c6;font-family:system-ui}#view{height:68vh;min-height:360px}#panel{padding:12px 16px;background:#1b2635}h2{font-size:17px;margin:4px 0 10px}button{background:#29384b;color:#f4e4c2;border:1px solid #6b614e;border-radius:8px;padding:10px;margin:3px;cursor:pointer}button.active{border:2px solid #edc978;background:#4c4536}.swatch{width:43px;height:43px;border-radius:50%;padding:0;border:2px solid #777}#status{font-size:13px;color:#b5c8d5;margin:8px 0}small{display:block;color:#c4b9a6;line-height:1.5}</style></head><body><div id="view"></div><div id="panel"><h2>Build 3K.11 — Skin Tone Test 2</h2><div><button id="male" class="active">Masculine</button><button id="female">Feminine</button><button id="reset">Original material</button></div><div id="swatches"></div><div id="status">Loading model...</div><small>Test 2: skin-only texture recolouring, preserving dark underwear. This is a calibration test; compare original and light/dark tones. Orbit: drag. Zoom: pinch.</small></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const tones=[['Porcelain','#F6D9C5'],['Fair Ivory','#EBC6AD'],['Light Beige','#DEB49A'],['Soft Sand','#D3A080'],['Warm Beige','#C68E6D'],['Golden Tan','#B77D55'],['Olive Brown','#A57455'],['Caramel','#96613F'],['Chestnut','#805039'],['Mahogany','#693E2E'],['Espresso','#512F25'],['Deep Ebony','#39241E']];const status=document.querySelector('#status'),view=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,view.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;view.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#151e2b');scene.add(new THREE.HemisphereLight(0xffffff,0x56647a,2.3));const light=new THREE.DirectionalLight(0xffebd2,2.4);light.position.set(3,7,5);scene.add(light);const camera=new THREE.PerspectiveCamera(35,view.clientWidth/view.clientHeight,.01,1000);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let current=null,materials=[],gender='masculine',selection=-1,loadId=0;const loader=new GLTFLoader();
function recolourTexture(source,hex){
 const img=source.image;if(!img||!img.width)return null;
 const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
 const data=ctx.getImageData(0,0,canvas.width,canvas.height),pixels=data.data;
 const target=new THREE.Color(hex);const tr=target.r*255,tg=target.g*255,tb=target.b*255;
 // Body atlases have dark underwear painted into their RGB pixels. Preserve those pixels.
 // Pixel luminance retains texture shadows and anatomical detail while selected tone supplies base hue.
 for(let i=0;i<pixels.length;i+=4){
  const r=pixels[i],g=pixels[i+1],b=pixels[i+2];
  const l=.2126*r+.7152*g+.0722*b;
  // Dark cloth is ~30-65 luminance; normal skin is predominantly >90.
  const keepSkin=THREE.MathUtils.smoothstep(l,66,105);
  if(keepSkin<=0)continue;
  const detail=Math.max(.50,Math.min(1.45,l/157));
  // Small share of original variation retains local skin undertones and facial details.
  const rr=Math.min(255,tr*detail*.92+r*.08);
  const gg=Math.min(255,tg*detail*.92+g*.08);
  const bb=Math.min(255,tb*detail*.92+b*.08);
  pixels[i]=r+(rr-r)*keepSkin;
  pixels[i+1]=g+(gg-g)*keepSkin;
  pixels[i+2]=b+(bb-b)*keepSkin;
 }
 ctx.putImageData(data,0,0);const texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 texture.flipY=source.flipY;texture.wrapS=source.wrapS;texture.wrapT=source.wrapT;
 texture.magFilter=source.magFilter;texture.minFilter=source.minFilter;
 texture.anisotropy=source.anisotropy;texture.needsUpdate=true;
 return texture;
}
function apply(){
 for(const item of materials){
  item.material.map=item.originalMap;
  item.material.color.copy(item.originalColor);
  if(selection>=0&&item.originalMap){
   if(!item.cache.has(selection))item.cache.set(selection,recolourTexture(item.originalMap,tones[selection][1]));
   const map=item.cache.get(selection);if(map){item.material.map=map;item.material.color.set(0xffffff)}
  }
  item.material.needsUpdate=true;
 }
 status.textContent=gender+' | '+(selection<0?'Original texture':tones[selection][0]+' — selective texture recolour')+' | '+materials.length+' body material(s)';
}
function load(g){
 const request=++loadId;gender=g;selection=-1;
 document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
 document.querySelector('#male').classList.toggle('active',g==='masculine');
 document.querySelector('#female').classList.toggle('active',g==='feminine');
 status.textContent='Loading '+g+' GLTF...';
 if(current){scene.remove(current);current=null}materials=[];
 const file=g==='masculine'?'Superhero_Male_FullBody.gltf':'Superhero_Female_FullBody.gltf';
 loader.load('./models/'+g+'/'+file,asset=>{
  if(request!==loadId)return;
  current=asset.scene;scene.add(current);
  current.traverse(o=>{if(!o.isMesh)return;
   const arr=Array.isArray(o.material)?o.material:[o.material];
   arr.forEach((m,i)=>{if(!m||!(/MI_Superhero/i).test(m.name))return;
    const cloned=m.clone();if(Array.isArray(o.material))o.material[i]=cloned;else o.material=cloned;
    materials.push({material:cloned,originalColor:cloned.color.clone(),originalMap:cloned.map,cache:new Map()});
   });
  });
  const b=new THREE.Box3().setFromObject(current),sz=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());
  const max=Math.max(sz.x,sz.y,sz.z);controls.target.copy(center);
  camera.position.set(center.x+max*.25,center.y+max*.08,center.z+max*2.5);
  camera.near=Math.max(.001,max/1000);camera.far=max*30;camera.updateProjectionMatrix();controls.update();apply();
 },undefined,e=>{if(request===loadId)status.textContent='Load failed: '+e.message;console.error(e)});
}
tones.forEach(([name,hex],i)=>{const b=document.createElement('button');b.className='swatch';b.style.background=hex;b.title=(i+1)+'. '+name;b.setAttribute('aria-label',name);b.onclick=()=>{selection=i;document.querySelectorAll('.swatch').forEach((x,j)=>x.classList.toggle('active',i===j));apply()};document.querySelector('#swatches').append(b)});document.querySelector('#male').onclick=()=>load('masculine');document.querySelector('#female').onclick=()=>load('feminine');document.querySelector('#reset').onclick=()=>{selection=-1;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));apply()};window.addEventListener('resize',()=>{camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();renderer.setSize(view.clientWidth,view.clientHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});load('masculine');</script></body></html>

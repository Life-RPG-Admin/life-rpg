<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>LIFE RPG — Cinematic Chronicle 0.3</title><style>
:root{--gold:#f0c37a;--ink:#352114}*{box-sizing:border-box}body{margin:0;background:#050507;color:#f8e7c8;font-family:Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}.stage{min-height:100dvh;position:relative;isolation:isolate;overflow:hidden;background:#050507;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 18px max(28px,env(safe-area-inset-bottom));text-align:center}.art{position:absolute;inset:0;z-index:-3;background:url('chronicle-art.jpg') center 34%/cover no-repeat;transform:scale(1.055);animation:zoom 11s ease-out both}.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(to bottom,rgba(2,3,7,.10),transparent 35%,rgba(4,3,6,.35) 66%,#080609 92%)}.night{position:absolute;inset:0;z-index:4;background:#000;pointer-events:none;animation:unveil 5s ease-in-out forwards}.night:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 17% 28%,transparent 0 8%,#000 48%);opacity:.5}.light{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(36px);mix-blend-mode:screen;animation:flicker 2.3s ease-in-out infinite alternate}.light.left{top:22%;left:-8%;width:44%;height:32%;background:#ff8d3026}.light.right{top:28%;right:-7%;width:40%;height:29%;background:#ff9d2d27;animation-delay:.7s}.spark{position:absolute;z-index:1;left:50%;top:48%;width:5px;height:5px;border-radius:50%;background:#fff1b1;box-shadow:0 0 16px 8px #f7b5427c;animation:pulse 2.5s infinite alternate;pointer-events:none}.controls{position:relative;z-index:5;width:min(100%,430px);opacity:0;animation:show 1s 5s forwards}.motto{font-style:italic;text-shadow:0 2px 8px #000;font-size:clamp(15px,4vw,19px);margin:0 0 15px}.gold{display:block;width:100%;background:linear-gradient(#e9c783,#a86b2e);border:2px solid #ffe3a4;border-radius:7px;padding:15px 18px;color:#241307;font-weight:bold;box-shadow:0 0 23px #d58a3e66,inset 0 0 0 2px #5d3618}.secondary{margin-top:12px;background:#0b0a0ed9;color:#f2d39e;border:1px solid #c39749;padding:11px 16px;border-radius:5px}.mode{font:12px system-ui,sans-serif;margin-top:16px;color:#ddd}.mode button{background:none;color:#ffd991;border:0;text-decoration:underline}.open{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#5a341b,#100c0b 70%);padding:18px}.open.active{display:flex}.bookspread{width:min(100%,660px);min-height:min(76dvh,650px);position:relative;background:linear-gradient(90deg,#b28b56 0%,#f0d9a6 8%,#f2e1b9 47%,#9b7348 49.8%,#e6c895 51%,#f1dcb0 93%,#b48c56 100%);border:12px ridge #55361e;border-radius:12px;box-shadow:0 15px 65px #000, inset 0 0 50px #71411b65;transform:perspective(850px) rotateY(-85deg) scale(.8);animation:openbook 1.5s ease forwards;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 18px;color:var(--ink)}.bookspread h2{font-size:clamp(20px,6vw,32px);margin:0 0 15px}.ink{width:100%;max-width:480px;text-align:center;white-space:pre-line;font-size:clamp(15px,4vw,20px);line-height:1.65;min-height:260px;text-wrap:pretty}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}.actions button{padding:10px 15px;border-radius:5px;background:#55351e;color:#fff0d4;border:1px solid #a9773f}.actions .next{background:#b47a35;color:#201006;font-weight:bold}.result{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;background:radial-gradient(#3d291b,#08090d 80%)}.result h2{font-size:clamp(30px,8vw,48px);color:#f2cb8c}.result p{max-width:400px;line-height:1.6}.curtain{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}.curtain.on{opacity:1}.hint{font:12px system-ui,sans-serif;opacity:.8}.hidden{display:none!important}@keyframes unveil{0%,15%{opacity:1}40%{opacity:.86}65%{opacity:.45}100%{opacity:0}}@keyframes show{to{opacity:1}}@keyframes flicker{to{opacity:.4;transform:scale(1.13)}}@keyframes pulse{to{opacity:.3;transform:scale(1.3)}}@keyframes zoom{to{transform:scale(1)}}@keyframes openbook{to{transform:perspective(850px) rotateY(0) scale(1)}}@media(min-width:750px){.art{background-size:contain;background-color:#080609}.stage{justify-content:flex-end}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.night{opacity:0}.controls{opacity:1}.bookspread{transform:none}.art{transform:none}}
</style></head><body><main class="stage" id="stage"><div class="art"></div><div class="shade"></div><div class="light left"></div><div class="light right"></div><div class="spark"></div><div class="night"></div><div class="controls"><p class="motto">Every legend begins with a choice...</p><button class="gold" id="launch">Start Your Journey</button><div class="mode">Preview mode: <button id="mode">New adventurer (switch)</button></div></div></main><section class="open" id="open" aria-label="The Chronicle opens"><div class="bookspread"><h2>The First Page</h2><div class="ink" id="ink" aria-live="off"></div><div class="actions"><button id="reveal">Reveal all text</button><button id="skip">Skip introduction</button><button id="next" class="next hidden">Begin My Story</button></div></div></section><section class="result" id="result"><h2 id="destination"></h2><p>This is a cinematic preview only. In the integrated game, this transition will connect to your real character creation or Adventurer's Guild.</p><button class="gold" onclick="location.reload()" style="max-width:300px">Replay Preview</button></section><div class="curtain" id="curtain"></div><script>
const $=x=>document.getElementById(x);let returning=false,cancel=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const lines=['Every legend begins somewhere.','Not with extraordinary power, but with a choice to grow.','Through your actions, your strengths will develop. Through your challenges, your story will unfold.','This Chronicle belongs to you.','What will you become?'];const full=lines.join('\n\n');const wait=ms=>new Promise(r=>setTimeout(r,ms));$('mode').onclick=()=>{returning=!returning;$('launch').textContent=returning?'Continue Journey':'Start Your Journey';$('mode').textContent=returning?'Returning adventurer (switch)':'New adventurer (switch)'};async function go(where){cancel=true;$('curtain').classList.add('on');await wait(reduced?0:950);$('stage').classList.add('hidden');$('open').classList.remove('active');$('destination').textContent=where;$('result').style.display='flex';$('curtain').classList.remove('on')}function reveal(){cancel=true;$('ink').textContent=full;$('reveal').classList.add('hidden');$('skip').classList.add('hidden');$('next').classList.remove('hidden')}async function write(){if(reduced){reveal();return}for(const line of lines){for(const c of line){if(cancel)return;$('ink').textContent+=c;await wait(32)}if(cancel)return;$('ink').textContent+='\n\n';await wait(480)}reveal()}$('launch').onclick=async()=>{if(returning){go("Adventurer's Guild");return}$('open').classList.add('active');await wait(reduced?0:1500);write()};$('reveal').onclick=reveal;$('skip').onclick=()=>go('Character Creation');$('next').onclick=()=>go('Character Creation');
</script></body></html>

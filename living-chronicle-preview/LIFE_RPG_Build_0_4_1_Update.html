<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>LIFE RPG — Living Ink Refinement 0.4.1</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08080b;color:#ffe6b4;font-family:Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.stage{position:relative;width:100%;height:100dvh;min-height:480px;overflow:hidden;isolation:isolate}.scene{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;transition:opacity 1.25s ease,transform 2.8s cubic-bezier(.2,.7,.15,1)}.closed{background-image:url('closed-chronicle.jpg');background-size:cover;opacity:1;transform:scale(1.05)}.opened{background-image:url('open-chronicle.jpg');background-size:contain;background-color:#08080b;opacity:0;transform:scale(.88)}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#0005,transparent 35%,#0009);transition:opacity 1.2s}.curtain{position:absolute;inset:0;background:#000;animation:reveal 3s forwards;pointer-events:none;z-index:5}.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 25%,#f7a4361e,transparent 38%),radial-gradient(ellipse at 85% 27%,#ffae3b18,transparent 36%);animation:flicker 2.8s ease-in-out infinite alternate;mix-blend-mode:screen}.ui{position:absolute;z-index:6;bottom:max(27px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}.btn{border:1px solid #ffdc96;background:linear-gradient(#f5d596,#b98138);color:#241406;border-radius:7px;min-height:48px;padding:12px 20px;box-shadow:0 3px 20px #0008;font-weight:bold;max-width:360px;width:100%}.label{font-size:14px;text-shadow:0 2px 8px #000}.stage.open .closed{opacity:0;transform:scale(1.18) rotateY(-7deg)}.stage.open .opened{opacity:1;transform:scale(1)}.stage.open .vignette{opacity:.15}.stage.open .ui{opacity:0;pointer-events:none}.stage.open .glow{opacity:.4}.writing{position:absolute;z-index:3;display:none;pointer-events:none;overflow:visible}.stage.writing-phase .writing,.stage.done .writing{display:block}.page{position:absolute;top:25%;width:31%;height:52%;color:#482b18;text-shadow:0 0 1px #8e6b3c45;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:var(--ink-size);line-height:1.48;overflow:hidden}.page.left{left:12.4%}.page.right{left:56%}.paragraph{margin:0 0 1.05em}.ink-line{display:block;white-space:nowrap;height:1.48em}.ink-reveal{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:top;max-width:100%;width:0;color:#482b18;filter:drop-shadow(0 0 1px #c99b45)}.ink-reveal.writing-now{animation:flowInk var(--duration) linear forwards}.ink-reveal.complete{width:100%;animation:none;filter:none}.initial{font-size:1.35em;color:#7a4a19}.stage.writing-phase .ui,.stage.done .ui{opacity:1;pointer-events:auto}.stage.writing-phase .vignette,.stage.done .vignette{opacity:0}.stage.writing-phase .opened,.stage.done .opened{opacity:1;transform:scale(1)}.stage.writing-phase .closed,.stage.done .closed{opacity:0}.stage.writing-phase .glow,.stage.done .glow{opacity:.3}.status{position:absolute;z-index:7;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;font-size:12px;letter-spacing:.08em;text-shadow:0 2px 8px #000}.spark{position:absolute;z-index:4;width:5px;height:5px;border-radius:50%;background:#ffe8a5;box-shadow:0 0 10px 4px #ffca57a0;display:none;pointer-events:none}.stage.writing-phase .spark{display:block}.stage.done .spark{display:none}@keyframes reveal{from{opacity:1}to{opacity:0}}@keyframes flicker{from{opacity:.4}to{opacity:1}}@keyframes flowInk{0%{width:0;filter:drop-shadow(0 0 3px #f2c268)}85%{filter:drop-shadow(0 0 2px #c99b45)}100%{width:100%;filter:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.curtain{opacity:0}}
</style></head><body><main class="stage" id="stage"><div class="scene closed"></div><div class="scene opened"></div><div class="glow"></div><div class="vignette"></div><div class="curtain"></div><div class="writing" id="writing"><div class="page left" id="left"></div><div class="page right" id="right"></div></div><div class="spark" id="spark"></div><div class="status">LIFE RPG · THE LIVING CHRONICLE · BUILD 0.4.1</div><div class="ui"><div class="label" id="hint">Every legend begins with a choice.</div><button class="btn" id="action">Start Your Journey</button></div></main><script>
const stage=document.getElementById('stage'),action=document.getElementById('action'),hint=document.getElementById('hint'),writing=document.getElementById('writing'),spark=document.getElementById('spark');const left=document.getElementById('left'),right=document.getElementById('right');const story=[['Every legend begins somewhere.','Not with extraordinary power, but with a choice to grow.','Through your actions, your strengths will develop.'],['Through your challenges, your story will unfold.','This Chronicle belongs to you.','What will you become?']];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let phase='closed',writingToken=0;
// Anchor text to the actual image rectangle produced by background-size: contain, not the full viewport.
function layout(){const w=stage.clientWidth,h=stage.clientHeight,ratio=1199/1312;let iw,ih;if(w/h>ratio){ih=h;iw=h*ratio}else{iw=w;ih=w/ratio}writing.style.left=((w-iw)/2)+'px';writing.style.top=((h-ih)/2)+'px';writing.style.width=iw+'px';writing.style.height=ih+'px';writing.style.setProperty('--ink-size',Math.max(10,iw*.030)+'px');}
function makeLines(page,paragraphs){page.replaceChildren();const font=getComputedStyle(page).font;const measure=document.createElement('canvas').getContext('2d');measure.font=font;const width=page.clientWidth-2;for(const para of paragraphs){const p=document.createElement('p');p.className='paragraph';const words=para.split(' ');let line='';const lines=[];for(const word of words){const candidate=line?line+' '+word:word;if(line&&measure.measureText(candidate).width>width){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);for(const str of lines){const lineEl=document.createElement('span');lineEl.className='ink-line';const ink=document.createElement('span');ink.className='ink-reveal';ink.textContent=str;lineEl.append(ink);p.append(lineEl)}page.append(p)}}
function build(){layout();makeLines(left,story[0]);makeLines(right,story[1]);}
function finish(){writingToken++;for(const el of document.querySelectorAll('.ink-reveal')){el.classList.remove('writing-now');el.classList.add('complete');el.style.width='100%'}stage.className='stage done';phase='done';hint.textContent='Your legend awaits.';action.textContent='Continue to Character Creation';}
function animateInk(){const token=++writingToken;const lines=[...document.querySelectorAll('.ink-reveal')];let idx=0;function next(){if(token!==writingToken)return;if(idx>=lines.length){finish();return}const el=lines[idx++];const duration=Math.max(340,el.textContent.length*36);el.style.setProperty('--duration',duration+'ms');el.classList.add('writing-now');const rect=el.getBoundingClientRect();spark.style.left=(rect.left-stage.getBoundingClientRect().left)+'px';spark.style.top=(rect.top-stage.getBoundingClientRect().top+rect.height/2)+'px';const start=performance.now();function follow(t){if(token!==writingToken)return;const progress=Math.min(1,(t-start)/duration);spark.style.left=(rect.left-stage.getBoundingClientRect().left+rect.width*progress)+'px';if(progress<1)requestAnimationFrame(follow)}requestAnimationFrame(follow);setTimeout(()=>{if(token!==writingToken)return;el.classList.remove('writing-now');el.classList.add('complete');el.style.width='100%';next()},duration+110)}next()}
function beginWriting(){if(phase!=='opening')return;stage.className='stage writing-phase';phase='writing';build();hint.textContent='The Chronicle remembers...';action.textContent='Reveal Writing';if(reduce)finish();else animateInk()}
action.addEventListener('click',()=>{if(phase==='closed'){phase='opening';stage.className='stage open';hint.textContent='The Chronicle awakens';setTimeout(beginWriting,reduce?100:2700)}else if(phase==='writing'){finish()}else if(phase==='done'){hint.textContent='Character Creation is not connected in this visual prototype.';action.textContent='Replay Chronicle';phase='placeholder'}else if(phase==='placeholder')location.reload()});window.addEventListener('resize',()=>{if(phase==='writing'){finish()}else if(phase==='done') {build();finish()}else layout()});layout();
</script></body></html>

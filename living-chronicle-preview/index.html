<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>LIFE RPG — Living Chronicle 0.4</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#08080b;color:#ffe6b4;font-family:Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}.stage{position:relative;width:100%;height:100dvh;min-height:480px;overflow:hidden;isolation:isolate}.scene{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;transition:opacity 1.25s ease,transform 2.8s cubic-bezier(.2,.7,.15,1);}.closed{background-image:url('closed-chronicle.jpg');background-size:cover;opacity:1;transform:scale(1.05)}.opened{background-image:url('open-chronicle.jpg');background-size:contain;background-color:#08080b;opacity:0;transform:scale(.88)}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,#0005,transparent 35%,#0009);transition:opacity 1.2s}.curtain{position:absolute;inset:0;background:#000;animation:reveal 3s forwards;pointer-events:none;z-index:5}.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 20% 25%,#f7a4361e,transparent 38%),radial-gradient(ellipse at 85% 27%,#ffae3b18,transparent 36%);animation:flicker 2.8s ease-in-out infinite alternate;mix-blend-mode:screen}.ui{position:absolute;z-index:6;bottom:max(27px,env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}.btn{border:1px solid #ffdc96;background:linear-gradient(#f5d596,#b98138);color:#241406;border-radius:7px;min-height:48px;padding:12px 20px;box-shadow:0 3px 20px #0008;font-weight:bold;max-width:360px;width:100%}.sub{background:#150e0dbd;color:#f4d49e;border:1px solid #cba76a;box-shadow:none}.label{font-size:14px;text-shadow:0 2px 8px #000}.stage.open .closed{opacity:0;transform:scale(1.18) rotateY(-7deg)}.stage.open .opened{opacity:1;transform:scale(1)}.stage.open .vignette{opacity:.15}.stage.open .ui{opacity:0;pointer-events:none}.stage.open .glow{opacity:.4}.writing{position:absolute;z-index:3;inset:0;display:none;pointer-events:none}.stage.writing-phase .writing,.stage.done .writing{display:block}.pageText{position:absolute;left:11%;top:27%;width:78%;height:48%;display:grid;grid-template-columns:1fr 1fr;gap:8%;color:#482b18;text-shadow:0 0 1px #8e6b3c45;font-style:italic;font-size:clamp(11px,2.5vw,21px);line-height:1.6;text-align:left;overflow:hidden}.pageText>div{overflow:hidden}.initial{font-size:1.6em;color:#7a4a19;text-shadow:0 0 8px #d99b3e88}.ink{white-space:pre-wrap}.stage.writing-phase .ui,.stage.done .ui{opacity:1;pointer-events:auto}.stage.writing-phase .vignette,.stage.done .vignette{opacity:0}.stage.writing-phase .opened,.stage.done .opened{opacity:1;transform:scale(1)}.stage.writing-phase .closed,.stage.done .closed{opacity:0}.stage.writing-phase .glow,.stage.done .glow{opacity:.3}.status{position:absolute;z-index:7;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;font-size:12px;letter-spacing:.08em;text-shadow:0 2px 8px #000}.spark{position:absolute;z-index:4;width:7px;height:7px;border-radius:50%;background:#ffe8a5;box-shadow:0 0 13px 5px #ffca57a0;left:14%;top:31%;display:none;pointer-events:none;animation:shimmer 1.4s infinite alternate}.stage.writing-phase .spark{display:block}.stage.done .spark{display:none}@keyframes reveal{0%{opacity:1}100%{opacity:0}}@keyframes flicker{from{opacity:.4}to{opacity:1}}@keyframes shimmer{from{opacity:.4}to{opacity:1}}@media(max-width:420px){.pageText{top:29%;height:43%;font-size:clamp(10px,2.65vw,14px);gap:7%;line-height:1.48}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}.curtain{opacity:0}}
</style></head><body><main class="stage" id="stage"><div class="scene closed"></div><div class="scene opened"></div><div class="glow"></div><div class="vignette"></div><div class="curtain"></div><div class="writing"><div class="pageText"><div><span class="initial">E</span><span class="ink" id="left"></span></div><div><span class="ink" id="right"></span></div></div></div><div class="spark"></div><div class="status">LIFE RPG · THE LIVING CHRONICLE · BUILD 0.4</div><div class="ui"><div class="label" id="hint">Every legend begins with a choice.</div><button class="btn" id="action">Start Your Journey</button><button class="btn sub" id="secondary" hidden>Reveal all writing</button></div></main><script>
const stage=document.getElementById('stage'),action=document.getElementById('action'),secondary=document.getElementById('secondary'),hint=document.getElementById('hint');const left=document.getElementById('left'),right=document.getElementById('right');const a='very legend begins somewhere.\n\nNot with extraordinary power, but with a choice to grow.\n\nThrough your actions, your strengths will develop.';const b='Through your challenges, your story will unfold.\n\nThis Chronicle belongs to you.\n\nWhat will you become?';let timer=null,phase='closed';const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function finish(){clearInterval(timer);left.textContent=a;right.textContent=b;stage.className='stage done';phase='done';hint.textContent='Your legend awaits.';action.textContent='Continue to Character Creation';secondary.hidden=true;}function beginWriting(){stage.className='stage writing-phase';phase='writing';hint.textContent='The Chronicle remembers...';action.textContent='Reveal Writing';secondary.hidden=true;if(reduce){finish();return;}let i=0;const full=a+b;timer=setInterval(()=>{i++;left.textContent=a.slice(0,i);right.textContent=b.slice(0,Math.max(0,i-a.length));if(i>=full.length)finish();},47);}action.addEventListener('click',()=>{if(phase==='closed'){phase='opening';stage.className='stage open';hint.textContent='The Chronicle awakens';setTimeout(beginWriting,reduce?100:2700);}else if(phase==='writing'){finish();}else if(phase==='done'){hint.textContent='Character Creation is not connected in this visual prototype.';action.textContent='Replay Chronicle';phase='placeholder';}else if(phase==='placeholder'){location.reload();}});
</script></body></html>
